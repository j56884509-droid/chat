<!DOCTYPE html>
<html><head>
<meta charset="utf-8">

<title>Chat</title>
<style>
:root{--bg:#0e1621;--panel:#17212b;--panel2:#242f3d;--hover:#202b36;--act:#2b5278;--bubble:#182533;--mine:#2b5278;--text:#fff;--sub:#8899aa;--accent:#2b95e0;--link:#6ab3f3;--border:#0b121a;--btnalt:#2b3a4a;--tick:#9cc3e6}
[data-theme=light]{--bg:#e6ebee;--panel:#fff;--panel2:#f0f2f5;--hover:#f1f3f5;--act:#cfe4f7;--bubble:#fff;--mine:#e1f4d2;--text:#111;--sub:#707a84;--accent:#2b95e0;--link:#1a78c2;--border:#d6dbe0;--btnalt:#dfe4e9;--tick:#4fae4e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column}
input,button,textarea,select{padding:12px;border-radius:10px;border:0;font-size:16px;font-family:inherit}
button{background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:var(--btnalt);color:var(--text)}
input,textarea{background:var(--panel2);color:var(--text)}
.screen{margin:auto;display:flex;flex-direction:column;gap:10px;width:80%;max-width:320px}
.langsel{padding:6px;font-size:14px;background:var(--btnalt);color:var(--text)}
#lerr{color:#ffb4b4;font-size:14px;min-height:18px}

#app{display:none;flex:1;min-height:0}
#side{width:330px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#shead{display:flex;align-items:center;gap:6px;padding:10px}
#sme{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#shead button{padding:6px 10px;font-size:14px}
#snew{display:flex;gap:6px;padding:0 10px 10px}
#room{flex:1;min-width:0;padding:10px}
#snew button{padding:10px 14px}
#usearch{margin:0 10px 8px;padding:10px;width:calc(100% - 20px)}
#rooms{flex:1;overflow:auto}
.ri{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.ri:hover{background:var(--hover)}
.ri.act{background:var(--act)}
.ra{width:50px;height:50px;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,#5ab0f0,#2b6cb0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;flex:none}
.rmid{flex:1;min-width:0}
.rl1,.rl2{display:flex;align-items:center;gap:6px}
.rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rtm{font-size:12px;color:var(--sub);flex:none}
.rlast{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:14px;margin-top:2px}
.bdg{background:var(--accent);color:#fff;font-size:12px;font-weight:600;border-radius:10px;min-width:20px;padding:1px 6px;text-align:center;flex:none}
.bdg.mut{background:#6b7885}
.rx{background:none;color:var(--sub);padding:0 4px;font-size:12px;flex:none}
#noroom{padding:16px;color:var(--sub);font-size:14px}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#empty{margin:auto;color:var(--sub);background:var(--panel);padding:6px 14px;border-radius:14px;font-size:14px}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel)}
#back{display:none;background:none;color:var(--text);padding:6px 10px;font-size:20px}
#tbox{flex:1;min-width:0;cursor:pointer}
#rtitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rsub{font-size:13px;color:var(--sub);min-height:16px}
#top button.pb{padding:6px 9px;font-size:15px}
#sbar{display:none;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border)}
#sq{flex:1;min-width:0;padding:8px 12px}

#log{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:80px;background:var(--bg)}
.row{display:flex;gap:6px;align-items:flex-end;max-width:80%;align-self:flex-start}
.mine{align-self:flex-end;flex-direction:row-reverse}
.av{font-size:26px;cursor:pointer}
.b{padding:6px 10px 4px;border-radius:14px 14px 14px 4px;background:var(--bubble);word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.me{background:var(--mine);border-radius:14px 14px 4px 14px}
.b.flash{outline:2px solid var(--accent)}
.n{font-size:13px;font-weight:600;color:var(--link);cursor:pointer;margin-bottom:2px}
.tx{white-space:pre-wrap}
.tx.del{color:var(--sub);font-style:italic}
.quote{border-left:3px solid var(--link);background:rgba(127,127,127,.14);border-radius:4px;padding:2px 8px;margin-bottom:4px;font-size:13px;cursor:pointer;overflow:hidden}
.quote b{display:block;color:var(--link);font-weight:600}
.quote span{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.media{display:block;width:260px;max-width:100%;border-radius:10px;cursor:pointer;background:var(--bg)}
audio.media{width:240px;height:40px;cursor:default;background:none}
.tm{font-size:11px;color:var(--sub);text-align:right;margin-top:2px;display:flex;gap:4px;justify-content:flex-end;align-items:center}
.mn{cursor:pointer;padding:0 3px;font-size:13px;opacity:.7}
.tk{color:var(--sub)}
.tk.rd{color:var(--tick)}
.sys{align-self:center;color:var(--sub);font-size:13px;text-align:center;background:var(--bubble);padding:3px 10px;border-radius:12px}

#menu{display:none;position:fixed;z-index:20;flex-direction:column;background:var(--panel);border-radius:12px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.35);min-width:160px}
#menu button{background:none;color:var(--text);text-align:left;padding:10px 12px;font-size:15px}
#menu button:hover{background:var(--hover)}

#rbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border)}
#rtxt{flex:1;min-width:0;border-left:3px solid var(--link);padding-left:8px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
#rbar button{background:none;color:var(--sub);padding:4px 8px}
#emo{display:none;flex-wrap:wrap;gap:2px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--border);max-height:120px;overflow:auto}
#emo span{font-size:24px;cursor:pointer;padding:2px 4px}

#bar{display:flex;gap:6px;padding:8px;background:var(--panel);align-items:center}
#msg{flex:1;min-width:0;border-radius:20px;padding:11px 16px}
#bar button{border-radius:50%;width:40px;height:40px;padding:0;font-size:18px;flex:none}
#bar button.alt{font-size:19px;background:none}
#bmain.rec{background:#d33}
#rcancel{display:none;background:var(--btnalt)}

#lobby{display:none;background:#243b55;color:#fff;padding:8px 12px}
#lbtn{display:flex;gap:8px;margin-top:6px}
#lbtn button{flex:1;padding:8px}
#game{display:none;background:#1b5e3a;color:#fff;padding:8px 12px;max-height:55vh;overflow:auto}
#gtop,#gstatus{font-size:14px;margin-bottom:4px}
#gerr{color:#ffb4b4;font-size:13px;min-height:16px}
#gtable{min-height:70px}
.pair{display:inline-flex;flex-direction:column;align-items:center;margin:4px 8px}
.card{display:inline-block;background:#fff;color:#000;border-radius:8px;padding:8px 6px;margin:3px;font-weight:bold;min-width:42px;text-align:center}
.red{color:#d22}
.over{margin-top:-14px;border:2px solid #2b95e0}
#ghand{overflow-x:auto;white-space:nowrap}
#gbtn{display:flex;gap:8px;margin-top:6px}
#gbtn button{flex:1;padding:8px}

#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:10}
#card{background:var(--panel);border-radius:16px;padding:18px;width:85%;max-width:340px;display:flex;flex-direction:column;gap:10px;text-align:center}
#pav{font-size:64px;display:flex;justify-content:center}
#pbio{color:var(--sub)}
#pedit{display:none}
#pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.opt{font-size:28px;cursor:pointer;padding:2px 4px}
#bioin{width:100%;height:70px;margin-bottom:8px}

@media(max-width:700px){
  #side{width:100%;border-right:0}
  #main{display:none}
  #app.inchat #side{display:none}
  #app.inchat #main{display:flex}
  #back{display:block}
  .row{max-width:90%}
}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:15}

#tbox{display:flex;flex-direction:column;justify-content:center}
#log{background:linear-gradient(165deg,#0e1621 0%,#14212f 100%)}
[data-theme=light] #main,[data-theme=light] #log{background:linear-gradient(165deg,#d5e5c4 0%,#a9cbbd 100%)}
.b{padding:6px 9px 6px 11px;border-radius:12px 12px 12px 3px;box-shadow:0 1px 1px rgba(0,0,0,.2);line-height:1.35}
.me{border-radius:12px 12px 3px 12px}
.bd,.tx{display:inline}
.tm{float:right;margin:8px 0 -3px 12px;font-size:11px}
.b::after{content:"";display:block;clear:both}
.mn{display:none}
.b:hover .mn{display:inline}
.dsep{align-self:center;background:rgba(60,72,84,.6);color:#fff;font-size:13px;padding:3px 12px;border-radius:14px;margin:6px 0}
#menu{min-width:210px}
#bar{padding:8px 10px;gap:8px;align-items:flex-end}

#pill button{background:none;color:var(--sub);width:38px;height:42px;font-size:21px;padding:0;border-radius:0;flex:none}

#bmain{width:46px!important;height:46px!important;font-size:20px!important}
#rcancel{width:46px!important;height:46px!important}
#card{max-height:90vh;overflow:auto}
#punm{color:var(--sub);font-size:14px;margin-top:-6px}

#seenin{width:100%;background:var(--panel2);color:var(--text);margin-bottom:8px}
#blist{text-align:left;font-size:14px;color:var(--sub)}
#blist .bi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;color:var(--text)}
#blist .bi button{padding:6px 10px;font-size:13px}

function t(k){ return T[LANG][k]; }
function $(id){ return document.getElementById(id); }
function enc(s){ return encodeURIComponent(s); }
function dn(x){ return x.display || x.name; }

function srv(text){
  if(LANG == "uz") return text;
  if(SRV[LANG][text]) return SRV[LANG][text];
  for(var i = 0; i < PAT.length; i++){
    if(PAT[i][0].test(text)) return text.replace(PAT[i][0], PAT[i][1][LANG]);
  }
  return text;
}

  document.querySelectorAll(".langsel").forEach(function(e){ e.value = LANG; });
  document.documentElement.lang = LANG;
  document.title = t("title");
  updateTr();
  renderRooms();
  if(lastGame) showGame(lastGame);
}

function setLang(l){

}

function applyTheme(){

}

function screen(id){

  });

function auth(kind){
  var n = $("name").value.trim();
  var p = $("pass").value;
  fetch("/" + kind, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: n, password: p})
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.error){ $("lerr").textContent = srv(d.error); return; }
    tok = d.token; me = d.name;
    localStorage.setItem("tok", tok);
    localStorage.setItem("me", me);

  });
}

}

function logout(){
  dropWs();
  clearInterval(pollT);
  localStorage.removeItem("tok");
  localStorage.removeItem("me");

/* ---------- chat list ---------- */
function saveRooms(){ localStorage.setItem("rooms", JSON.stringify(ROOMS)); }

function addRoom(){
  var r = $("room").value.trim();
  if(!r || r.toLowerCase().indexOf("dm:") == 0) return;
  $("room").value = "";
  $("nrm").style.display = "none";
  if(ROOMS.indexOf(r) < 0){ ROOMS.unshift(r); saveRooms(); }
  openRoom(r);
}

function removeRoom(r){
  ROOMS = ROOMS.filter(function(x){ return x != r; });
  saveRooms();
  if(curRoom == r) closeRoom();
  renderRooms();
}

function dmRoom(other){ return "dm:" + [me, other].sort().join("|"); }
function isDm(){ return !!curRoom && curRoom.indexOf("dm:") == 0; }
function dmOther(room){
  var p = room.slice(3).split("|");
  return p[0] == me ? p[1] : p[0];
}

function loadMe(){
  fetch("/profile/me?token=" + enc(tok)).then(function(r){ return r.json(); }).then(function(p){
    if(p && !p.error) $("sme").textContent = p.display || p.name;
  }).catch(function(){});
}

function loadChats(){
  if(!tok) return;
  fetch("/chats?token=" + enc(tok) + "&rooms=" + enc(JSON.stringify(ROOMS)))
    .then(function(r){ return r.json(); }).then(function(d){
      if(!d || d.error || !d.dms) return;
      CHATS = d;
      NEWDM = NEWDM.filter(function(u){ return !d.dms.some(function(x){ return x.name == u.name; }); });
      renderRooms();
    }).catch(function(){});
}

function poll(){
  if(!tok) return;
  loadChats();
  if(isDm()) refreshStatus();
}

function openDm(u){
  if(!CHATS.dms.some(function(x){ return x.name == u.name; }) &&
     !NEWDM.some(function(x){ return x.name == u.name; })) NEWDM.push(u);
  $("usearch").value = "";
  $("sres").innerHTML = "";
  openRoom(dmRoom(u.name));
}

function searchUsers(){
  clearTimeout(window.sTimer);
  var q = $("usearch").value.trim();
  if(!q){ $("sres").innerHTML = ""; return; }
  window.sTimer = setTimeout(function(){
    fetch("/users?q=" + enc(q) + "&token=" + enc(tok))
      .then(function(r){ return r.json(); }).then(function(l){
        var box = $("sres"); box.innerHTML = "";
        if(!Array.isArray(l)) return;
        l.forEach(function(u){
          var d = document.createElement("div"); d.className = "ri";
          var a = document.createElement("div"); a.className = "ra"; setAv(a, u.avatar, 50);
          var n = document.createElement("div"); n.className = "rn"; n.textContent = dn(u);
          d.onclick = function(){ openDm(u); };
          d.appendChild(a); d.appendChild(n);
          box.appendChild(d);
        });
      }).catch(function(){});
  }, 300);
}

function snip(text){
  text = text || "";
  var m = MEDIA.exec(text);
  if(m) return t(m[1] == "img" ? "sphoto" : m[1] == "vid" ? "svideo" : "svoice");
  return text.slice(0, 80);
}

function fmtTime(ts){
  if(!ts) return "";
  var d = new Date(ts), n = new Date();
  if(d.toDateString() == n.toDateString()) return hhmm(ts);
  return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2);
}

function lastText(x){
  var l = x.last;
  if(!l) return "";
  var body = l.deleted ? "🚫 " + t("deleted") : snip(l.text);
  if(l.name == me) return t("you") + ": " + body;
  return (x.dm ? "" : (l.display || l.name) + ": ") + body;
}

function chatItems(){
  var items = [], seen = {};
  CHATS.dms.forEach(function(d){
    seen[d.name] = 1;
    var sv = (d.name == me);
    items.push({room: dmRoom(d.name), title: sv ? t("saved") : dn(d), avatar: sv ? "🔖" : d.avatar, dm: true, last: d.last, unread: sv ? 0 : d.unread});
  });
  NEWDM.forEach(function(u){
    if(!seen[u.name]) items.push({room: dmRoom(u.name), title: dn(u), avatar: u.avatar, dm: true, last: null, unread: 0});
  });
  if(!seen[me]) items.push({room: dmRoom(me), title: t("saved"), avatar: "🔖", dm: true, last: null, unread: 0});
  ROOMS.forEach(function(r){
    var i = CHATS.rooms[r] || {};
    items.push({room: r, title: r, dm: false, last: i.last || null, unread: i.unread || 0});
  });
  items.forEach(function(x){ if(x.room == curRoom) x.unread = 0; });
  items.sort(function(a, b){
    var pa = PINS.indexOf(a.room) >= 0 ? 1 : 0, pb = PINS.indexOf(b.room) >= 0 ? 1 : 0;
    if(pa != pb) return pb - pa;
    return ((b.last && b.last.time) || 0) - ((a.last && a.last.time) || 0);
  });
  return items;
}

function renderRooms(){
  var box = $("rooms");
  if(!box) return;
  box.innerHTML = "";
  var items = chatItems();
  if(!items.length){
    var e = document.createElement("div");
    e.id = "noroom"; e.textContent = t("norooms");
    box.appendChild(e);
    return;
  }
  items.forEach(function(x){
    var muted = MUTES.indexOf(x.room) >= 0, pinned = PINS.indexOf(x.room) >= 0;
    var d = document.createElement("div");
    d.className = "ri" + (x.room == curRoom ? " act" : "");
    var a = document.createElement("div");
    a.className = "ra";
    if(x.dm) setAv(a, x.avatar, 50); else a.textContent = x.title.charAt(0).toUpperCase();
    var mid = document.createElement("div"); mid.className = "rmid";
    var l1 = document.createElement("div"); l1.className = "rl1";
    var n = document.createElement("span"); n.className = "rn"; n.textContent = x.title;
    l1.appendChild(n);
    if(muted){ var mu = document.createElement("span"); mu.className = "rtm"; mu.textContent = "🔕"; l1.appendChild(mu); }
    if(pinned){ var pi = document.createElement("span"); pi.className = "rtm"; pi.textContent = "📌"; l1.appendChild(pi); }
    var tm = document.createElement("span"); tm.className = "rtm"; tm.textContent = fmtTime(x.last && x.last.time);
    l1.appendChild(tm);
    if(!x.dm){
      var rx = document.createElement("button");
      rx.className = "rx"; rx.textContent = "✕";
      rx.onclick = function(ev){ ev.stopPropagation(); removeRoom(x.room); };
      l1.appendChild(rx);
    }
    var l2 = document.createElement("div"); l2.className = "rl2";
    var lt = document.createElement("span"); lt.className = "rlast"; lt.textContent = lastText(x);
    l2.appendChild(lt);
    if(x.unread > 0){
      var bd = document.createElement("span");
      bd.className = "bdg" + (muted ? " mut" : "");
      bd.textContent = x.unread > 99 ? "99+" : x.unread;
      l2.appendChild(bd);
    }
    mid.appendChild(l1); mid.appendChild(l2);
    d.onclick = function(){ openRoom(x.room); };
    d.appendChild(a); d.appendChild(mid);
    box.appendChild(d);
  });
  updateHeaderBtns();
}

function toggleIn(arr, key, v){
  var i = arr.indexOf(v);
  if(i < 0) arr.push(v); else arr.splice(i, 1);
  localStorage.setItem(key, JSON.stringify(arr));
}
function togglePin(){ if(!curRoom) return; toggleIn(PINS, "pins", curRoom); updateHeaderBtns(); renderRooms(); }
function toggleMute(){ if(!curRoom) return; toggleIn(MUTES, "mutes", curRoom); updateHeaderBtns(); renderRooms(); }
function dmTitle(room){
  var o = dmOther(room);
  if(o == me) return t("saved");
  var u = CHATS.dms.concat(NEWDM).filter(function(x){ return x.name == o; })[0];
  return u ? dn(u) : o;
}

function updateHeaderBtns(){
  var a = $("tav");
  if(!a || !curRoom) return;
  if(isDm()){
    var o = dmOther(curRoom);
    var u = CHATS.dms.concat(NEWDM).filter(function(x){ return x.name == o; })[0];
    setAv(a, o == me ? "🔖" : (u ? u.avatar : "🙂"), 42);
    $("rtitle").textContent = dmTitle(curRoom);
  } else a.textContent = curRoom.charAt(0).toUpperCase();
}

function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function dayLabel(ts){
  var d = new Date(ts), n = new Date(), y = new Date(Date.now() - 86400000);
  if(dayKey(ts) == dayKey(n.getTime())) return t("today");
  if(dayKey(ts) == dayKey(y.getTime())) return t("yday");
  return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + "." + d.getFullYear();
}

function popup(items, ev){
  ev.stopPropagation();
  var mn = $("menu"); mn.innerHTML = "";
  items.forEach(function(it){
    var bt = document.createElement("button");
    bt.textContent = it[0];
    bt.onclick = function(e){ e.stopPropagation(); closeMenu(); it[1](); };
    mn.appendChild(bt);
  });
  mn.style.display = "flex";
  var x = ev.clientX || 20, y = ev.clientY || 20;
  mn.style.left = Math.max(8, Math.min(x, window.innerWidth - 230)) + "px";
  mn.style.top = Math.max(8, Math.min(y, window.innerHeight - 60 - items.length * 44)) + "px";
}

/* ---------- connection ---------- */
function dropWs(){
  stopRec(false);
  if(ws){ var old = ws; ws = null; old.onclose = null; old.close(); }
}

function titleClick(){
  if(isDm() && dmOther(curRoom) != me) openProfile(dmOther(curRoom));
}

function updateSub(){
  $("rsub").textContent = typingName ? (isDm() ? t("typing") : typingName + " " + t("typing")) : subBase;
}

function refreshStatus(){
  if(!isDm() || dmOther(curRoom) == me) return;
  var o = dmOther(curRoom);
  fetch("/profile/" + enc(o) + "?token=" + enc(tok)).then(function(r){ return r.json(); }).then(function(p){
    if(p.error || !isDm() || dmOther(curRoom) != o) return;
    subBase = statusText(p);
    updateSub();
  }).catch(function(){});
}

function showTyping(name){
  typingName = name;
  updateSub();
  clearTimeout(typTimer);
  typTimer = setTimeout(function(){ typingName = ""; updateSub(); }, 3000);
}

function openRoom(room){
  dropWs();
  curRoom = room;
  got = false;
  lastGame = null;
  MSGS = {}; OTHER_READ = 0; LASTID = 0; SENT_READ = 0; LASTDAY = "";
  typingName = ""; subBase = "";
  cancelReply();
  closeSearch();
  $("emo").style.display = "none";
  $("log").innerHTML = "";
  $("game").style.display = "none";
  $("lobby").style.display = "none";
  $("rtitle").textContent = isDm() ? dmTitle(room) : "# " + room;
  updateSub();
  $("empty").style.display = "none";
  $("chat").style.display = "flex";
  $("app").classList.add("inchat");
  updateHeaderBtns();
  updateMainBtn();
  renderRooms();
  if(isDm()) refreshStatus();
  var proto = location.protocol == "https:" ? "wss://" : "ws://";
  var mine = new WebSocket(proto + location.host + "/ws/" + enc(room) + "/" + tok);
  ws = mine;
  mine.onmessage = onmsg;
  mine.onclose = function(){
    if(ws !== mine) return;
    if(!got){
      logout();
      $("lerr").textContent = t("relogin");
    } else {
      addMsg({type: "system", text: t("lost")}, true);
    }
  };
}

function closeRoom(){
  dropWs();
  curRoom = null;
  $("chat").style.display = "none";
  $("empty").style.display = "block";
  $("app").classList.remove("inchat");
  renderRooms();
  loadChats();
}

function onmsg(e){
  got = true;
  var m = JSON.parse(e.data);
  if(m.type == "game") showGame(m);
  else if(m.type == "lobby") showLobby(m);
  else if(m.type == "err"){
    if($("game").style.display == "block") $("gerr").textContent = srv(m.text);
    else addMsg({type: "system", text: m.text});
  }
  else if(m.type == "reads"){
    var mx = 0;
    for(var k in m.reads){ if(k != me && m.reads[k] > mx) mx = m.reads[k]; }
    OTHER_READ = mx; updateTicks();
  }
  else if(m.type == "read"){
    if(m.name != me && m.upto > OTHER_READ){ OTHER_READ = m.upto; updateTicks(); }
  }
  else if(m.type == "typing") showTyping(m.display || m.name);
  else if(m.type == "edit"){
    var r = MSGS[m.id];
    if(r){ r.m.text = m.text; r.m.edited = 1; buildBody(r); }
  }
  else if(m.type == "del"){
    var r2 = MSGS[m.id];
    if(r2){ r2.m.deleted = 1; r2.m.text = ""; buildBody(r2); }
  }
  else {
    addMsg(m);
    if(m.type == "msg"){
      if(dn(m) == typingName){ typingName = ""; updateSub(); }
      if(m.id){
        if(m.id > LASTID) LASTID = m.id;
        if(m.name != me) markReadSoon();
      }
    }
  }
}

}

/* ---------- messages ---------- */
function hhmm(ts){
  if(!ts) return "";
  var d = new Date(ts);
  if(isNaN(d.getTime())) return "";
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function scrollDown(){ var l = $("log"); l.scrollTop = l.scrollHeight; }

function note(text){
  var s = document.createElement("div");
  s.className = "sys"; s.textContent = text;
  $("log").appendChild(s);
  scrollDown();
  return s;
}

function flags(rec){
  if(rec.fl) rec.fl.textContent = (rec.m.edited ? "✏️ " : "") + (rec.translated ? "🌐" : "");
}

function tickOne(rec){
  if(!rec.tk) return;
  if(!rec.mine || !rec.m.id || rec.m.deleted || (isDm() && dmOther(curRoom) == me)){ rec.tk.textContent = ""; return; }
  var rd = rec.m.id <= OTHER_READ;
  rec.tk.textContent = rd ? "✓✓" : "✓";
  rec.tk.className = "tk" + (rd ? " rd" : "");
}

function updateTicks(){ for(var k in MSGS) tickOne(MSGS[k]); }

function fillText(rec){
  var m = rec.m, tx = rec.tx;
  tx.textContent = m.text;
  tx.style.cursor = ""; tx.onclick = null;
  rec.translated = false; rec.trText = null;
  flags(rec);
  if(rec.mine || !TR || m.text.length > 450) return;
  var cur = m.text;
  tx.style.opacity = ".55";
  fetch("/translate?text=" + enc(cur) + "&to=" + LANG)
    .then(function(r){ return r.json(); })
    .then(function(d){
      tx.style.opacity = "";
      if(rec.m.text !== cur) return;
      if(d.text && d.text.trim().toLowerCase() != cur.trim().toLowerCase()){
        rec.trText = d.text; rec.translated = true;
        tx.textContent = d.text;
        tx.style.cursor = "pointer";
        tx.onclick = function(){
          rec.translated = !rec.translated;
          tx.textContent = rec.translated ? rec.trText : rec.m.text;
          flags(rec);
        };
        flags(rec);
        if(rec.stick) scrollDown();
      }
    }).catch(function(){ tx.style.opacity = ""; });
}

function buildBody(rec){
  var m = rec.m, body = rec.body;
  body.innerHTML = "";
  rec.tx = null;
  if(m.deleted){
    var d = document.createElement("div");
    d.className = "tx del"; d.textContent = "🚫 " + t("deleted");
    body.appendChild(d);
    flags(rec); tickOne(rec);
    return;
  }
  var mm = MEDIA.exec(m.text);
  if(mm){
    var el = document.createElement(mm[1] == "img" ? "img" : mm[1] == "vid" ? "video" : "audio");
    el.className = "media"; el.src = mm[2];
    var down = function(){ if(rec.stick) scrollDown(); };
    if(mm[1] == "vid"){ el.controls = true; el.preload = "metadata"; el.onloadedmetadata = down; }
    else if(mm[1] == "aud"){ el.controls = true; el.preload = "metadata"; }
    else { el.onclick = function(){ window.open(mm[2]); }; el.onload = down; }
    body.appendChild(el);
    flags(rec); tickOne(rec);
    return;
  }
  var tx = document.createElement("div");
  tx.className = "tx";
  body.appendChild(tx);
  rec.tx = tx;
  fillText(rec);
  tickOne(rec);
}

    var qt = document.createElement("span");
    qt.textContent = m.reply.text ? snip(m.reply.text) : "🚫 " + t("deleted");
    q.appendChild(qn); q.appendChild(qt);

  b.appendChild(tm);

/* ---------- message menu, reply, edit ---------- */
function closeMenu(){ $("menu").style.display = "none"; }

function copyText(s){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(s).catch(function(){}); return; }
  var a = document.createElement("textarea");
  a.value = s; document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){}
  a.remove();
}

function openMenu(rec, ev){
  ev.stopPropagation();
  if(rec.m.deleted || !rec.m.id) return;
  var mn = $("menu"); mn.innerHTML = "";
  function item(label, fn){
    var bt = document.createElement("button");
    bt.textContent = label;
    bt.onclick = function(e){ e.stopPropagation(); closeMenu(); fn(); };
    mn.appendChild(bt);
  }
  var isMedia = MEDIA.test(rec.m.text);
  item("↩ " + t("reply"), function(){ startReply(rec); });
  if(!isMedia) item("📋 " + t("copy"), function(){ copyText(rec.m.text); });
  if(rec.mine && !isMedia) item("✏️ " + t("edit"), function(){ startEdit(rec); });
  if(rec.mine) item("🗑 " + t("del"), function(){ if(ws) ws.send(JSON.stringify({type: "del", id: rec.m.id})); });
  if(!rec.mine) item("🚩 " + t("report"), function(){ reportMsg(rec.m.id); });
  mn.style.display = "flex";
  var x = ev.clientX || 20, y = ev.clientY || 20;
  mn.style.left = Math.max(8, Math.min(x, window.innerWidth - 180)) + "px";
  mn.style.top = Math.max(8, Math.min(y, window.innerHeight - 200)) + "px";
}

function startReply(rec){
  editing = null;
  replyTo = {id: rec.m.id};
  $("rtxt").textContent = "↩ " + dn(rec.m) + ": " + snip(rec.m.text);

function startEdit(rec){

function cancelReply(){
  if(editing) $("msg").value = "";
  replyTo = null; editing = null;
  $("rbar").style.display = "none";

}

function send(){
  var i = $("msg"), v = i.value.trim();
  if(!ws || !v) return;
  if(editing){
    if(v !== editing.m.text) ws.send(JSON.stringify({type: "edit", id: editing.m.id, text: v}));
    editing = null; i.value = "";
    $("rbar").style.display = "none";
    updateMainBtn();

  }

  ws.send(JSON.stringify(p));
  i.value = "";
  cancelReply();

/* ---------- voice and files ---------- */
function startRec(){
  if(!ws) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    addMsg({type: "system", text: t("nomic")}, true); return;
  }
  navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream){
    var mt = "";
    ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].some(function(x){
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)){ mt = x; return true; }
      return false;
    });
    var rr;
    try{ rr = mt ? new MediaRecorder(stream, {mimeType: mt}) : new MediaRecorder(stream); }
    catch(e){
      stream.getTracks().forEach(function(x){ x.stop(); });
      addMsg({type: "system", text: t("nomic")}, true); return;
    }
    mr = rr; mchunks = []; mSend = false;
    rr.ondataavailable = function(e){ if(e.data && e.data.size) mchunks.push(e.data); };
    rr.onstop = function(){
      stream.getTracks().forEach(function(x){ x.stop(); });
      if(mSend && Date.now() - mStart > 800 && mchunks.length){
        sendFile(new Blob(mchunks, {type: rr.mimeType || mt || "audio/webm"}));
      }
    };
    rr.start();
    mStart = Date.now(); recording = true;
    $("msg").disabled = true; $("rcancel").style.display = "block";
    updateMainBtn();
    clearInterval(mTimer);
    mTimer = setInterval(function(){
      var s = Math.floor((Date.now() - mStart) / 1000);
      $("msg").placeholder = "🔴 " + Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2);
    }, 300);
  }).catch(function(){ addMsg({type: "system", text: t("nomic")}, true); });
}

function stopRec(sendIt){
  if(!recording) return;
  mSend = sendIt; recording = false;
  clearInterval(mTimer);
  $("msg").disabled = false; $("msg").placeholder = t("msg");
  $("rcancel").style.display = "none";
  try{ mr.stop(); }catch(e){}
  updateMainBtn();
}

function upload(inp){
  var f = inp.files[0]; inp.value = "";
  sendFile(f);
}

function sendFile(f){
  var w = ws;
  if(!f || !w) return;
  if(f.size > 25 * 1024 * 1024){ addMsg({type: "system", text: t("big")}, true); return; }
  var nt = note(t("sending"));
  fetch("/upload?token=" + enc(tok), {
    method: "POST", headers: {"Content-Type": f.type}, body: f
  }).then(function(r){ return r.json(); }).then(function(d){
    nt.remove();
    if(d.error){ addMsg({type: "system", text: t("upfail")}, true); return; }
    var tag = d.kind == "img" ? "[img]" : d.kind == "vid" ? "[vid]" : "[aud]";
    if(ws === w) w.send(JSON.stringify({type: "msg", text: tag + d.url}));
  }).catch(function(){ nt.remove(); addMsg({type: "system", text: t("upfail")}, true); });
}

function isImg(a){ return /^\/uploads\/[\w\-]+\.(jpg|png|gif|webp)$/.test(a || ""); }

function uploadAvatar(inp){
  var f = inp.files[0]; inp.value = "";
  if(!f) return;
  var img = new Image();
  img.onload = function(){
    var s = Math.min(img.width, img.height), c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
    URL.revokeObjectURL(img.src);
    c.toBlob(function(blob){
      fetch("/upload?token=" + enc(tok), {
        method: "POST", headers: {"Content-Type": "image/jpeg"}, body: blob
      }).then(function(r){ return r.json(); }).then(function(d){
        if(d.url){ chosen = d.url; setAv($("pav"), d.url, 96); }
      }).catch(function(){});
    }, "image/jpeg", 0.85);
  };
  img.src = URL.createObjectURL(f);
}
