<!DOCTYPE html>
<html><head>

<title>Chat</title>
<style>

input,button,textarea,select{padding:12px;border-radius:10px;border:0;font-size:16px;font-family:inherit}
button{background:#2b95e0;color:#fff;cursor:pointer}
button.alt{background:#2b3a4a}
.screen{margin:auto;display:flex;flex-direction:column;gap:10px;width:80%;max-width:320px}
.langsel{padding:6px;font-size:14px;background:#2b3a4a;color:#fff}
#lerr{color:#ffb4b4;font-size:14px;min-height:18px}

/* app layout */
#app{display:none;flex:1;min-height:0}
#side{width:330px;background:#17212b;border-right:1px solid #0b121a;display:flex;flex-direction:column;min-height:0}
#shead{display:flex;align-items:center;gap:8px;padding:10px}
#sme{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#shead button{padding:6px 10px;font-size:14px}
#snew{display:flex;gap:6px;padding:0 10px 10px}
#room{flex:1;min-width:0;background:#242f3d;color:#fff;padding:10px}
#snew button{padding:10px 14px}
#rooms{flex:1;overflow:auto}
.ri{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.ri:hover{background:#202b36}
.ri.act{background:#2b5278}
.ra{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#5ab0f0,#2b6cb0);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex:none}
.rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx{background:none;color:#8899aa;padding:4px 8px;font-size:14px}
#noroom{padding:16px;color:#8899aa;font-size:14px}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#0e1621}
#empty{margin:auto;color:#8899aa;background:#17212b;padding:6px 14px;border-radius:14px;font-size:14px}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#17212b}
#back{display:none;background:none;padding:6px 10px;font-size:20px}
#rtitle{flex:1;font-weight:600}
#top button.pb{padding:6px 10px;font-size:14px}

#log{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:80px;background:#0e1621}
.row{display:flex;gap:6px;align-items:flex-end;max-width:80%;align-self:flex-start}
.mine{align-self:flex-end;flex-direction:row-reverse}
.av{font-size:26px;cursor:pointer}
.b{padding:6px 10px 4px;border-radius:14px 14px 14px 4px;background:#182533;word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.me{background:#2b5278;border-radius:14px 14px 4px 14px}
.n{font-size:13px;font-weight:600;color:#6ab3f3;cursor:pointer;margin-bottom:2px}
.tx{white-space:pre-wrap}
.trn{font-size:14px;color:#b9d3ec;border-top:1px solid rgba(255,255,255,.14);margin-top:4px;padding-top:4px;white-space:pre-wrap}
.media{display:block;width:260px;max-width:100%;border-radius:10px;cursor:pointer;background:#0e1621}
.tm{font-size:11px;color:#8ba3b8;text-align:right;margin-top:2px}
.me .tm{color:#9cc3e6}
.sys{align-self:center;color:#aab8c5;font-size:13px;text-align:center;background:#182533;padding:3px 10px;border-radius:12px}

#bar{display:flex;gap:8px;padding:8px;background:#17212b;align-items:center}
#msg{flex:1;min-width:0;background:#242f3d;color:#fff;border-radius:20px;padding:11px 16px}
#bar button{border-radius:50%;width:44px;height:44px;padding:0;font-size:18px;flex:none}
#bar button.alt{font-size:20px}

#lobby{display:none;background:#243b55;padding:8px 12px}
#lbtn{display:flex;gap:8px;margin-top:6px}
#lbtn button{flex:1;padding:8px}
#game{display:none;background:#1b5e3a;padding:8px 12px;max-height:55vh;overflow:auto}
#gtop,#gstatus{font-size:14px;margin-bottom:4px}
#gerr{color:#ffb4b4;font-size:13px;min-height:16px}
#gtable{min-height:70px}
.pair{display:inline-flex;flex-direction:column;align-items:center;margin:4px 8px}
.card{display:inline-block;background:#fff;color:#000;border-radius:8px;padding:8px 6px;margin:3px;font-weight:bold;min-width:42px;text-align:center}
.red{color:#d22}
.over{margin-top:-14px;border:2px solid #2b95e0}
#ghand{overflow-x:auto;white-space:nowrap}
#gbtn{display:flex;gap:8px;margin-top:6px}
#gbtn button{flex:1;padding:8px}

#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:10}
#card{background:#17212b;border-radius:16px;padding:18px;width:85%;max-width:340px;display:flex;flex-direction:column;gap:10px;text-align:center}
#pav{font-size:64px}
#pbio{color:#c0ccd8}
#pedit{display:none}
#pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.opt{font-size:28px;cursor:pointer;padding:2px 4px}
#bioin{width:100%;height:70px;margin-bottom:8px}

@media(max-width:700px){
  #side{width:100%;border-right:0}
  #main{display:none}
  #app.inchat #side{display:none}
  #app.inchat #main{display:flex}
  #back{display:block}
  .row{max-width:90%}
}
</style></head><body>

try { ROOMS = JSON.parse(localStorage.getItem("rooms") || "[]"); } catch(e) { ROOMS = []; }

       ltitle:"🃏 Дурак: игроки (2-4)", ljoin:"Присоединиться", lleave:"Выйти", lstart:"Начать"},
  en: {title:"Chat", name:"Name", pass:"Password", login:"Login", register:"Sign up",
       room:"New room name", logout:"Log out", empty:"Pick a chat or add a new room",
       norooms:"No rooms yet. Type a name above and press ＋.",
       profile:"👤 My profile", msg:"Write a message...", take:"Take", done:"Done", save:"Save",

       help:"You can also add matching cards", outs:"You are out of cards ✅",
       cards:" cards", deck:"Deck: ", trump:"Trump: ", relogin:"Please log in again",
       lost:"Connection lost. Reopen the room.", big:"File is too large (up to 25 MB)", upfail:"Could not send", sending:"Sending...",
       ltitle:"🃏 Durak: players (2-4)", ljoin:"Join", lleave:"Leave", lstart:"Start"}
};

var SRV = {
  ru: {
    "Ism 2-20 harf, parol kamida 4 belgi bo'lsin": "Имя 2–20 символов, пароль не короче 4 символов",
    "Bu ism band": "Это имя занято",
    "Ism yoki parol noto'g'ri": "Неверное имя или пароль",

    "O'yin allaqachon boshlangan": "Игра уже идёт",

    "Faqat boshlovchi o'yinni boshlay oladi": "Начать игру может только организатор",

  },
  en: {

    "Bu ism band": "This name is taken",

    "Birinchi karta tashlash navbati hujumchiniki": "Only the attacker plays the first card",

    "Bunday karta yo'q": "You don't have this card",
    "Bu kartani tashlab bo'lmaydi": "You can't play this card",
    "Siz himoyalanuvchi emassiz": "You are not defending",
    "Bu karta hech birini yopa olmaydi": "This card beats nothing",
    "Hozir olib bo'lmaydi": "You can't take now",
    "Hozir bito qilib bo'lmaydi": "You can't finish now",
    "O'yin tugagan": "The game is over",
    "O'yin allaqachon boshlangan": "A game is already in progress",
    "O'yinda 4 kishi to'lgan": "Already 4 players",
    "Faqat boshlovchi o'yinni boshlay oladi": "Only the host can start the game",
    "Durak uchun kamida 2 kishi kerak": "Durak needs at least 2 players",
    "O'yin to'xtadi": "The game stopped",
    "Bito": "Round over",
    "Durang!": "Draw!"

var PAT = [
  [/^(.+) qo'shildi$/, {ru: "$1 в чате", en: "$1 joined"}],
  [/^(.+) chiqib ketdi$/, {ru: "$1 вышел", en: "$1 left"}],
  [/^Durak boshlandi: (.+)$/, {ru: "Дурак начался: $1", en: "Durak started: $1"}],
  [/^(.+) durak o'yiniga odam yig'moqda$/, {ru: "$1 собирает игроков в дурака", en: "$1 is gathering players for Durak"}],
  [/^(.+) kartalarni oldi$/, {ru: "$1 взял карты", en: "$1 took the cards"}],
  [/^(.+) kartalarini tugatdi$/, {ru: "Карты закончились у: $1", en: "Out of cards: $1"}],
  [/^(.+) durak! 🤡$/, {ru: "$1 — дурак! 🤡", en: "$1 is the durak! 🤡"}]
];

function t(k){ return T[LANG][k]; }
function $(id){ return document.getElementById(id); }

function srv(text){
  if(LANG == "uz") return text;
  if(SRV[LANG][text]) return SRV[LANG][text];
  for(var i = 0; i < PAT.length; i++){
    if(PAT[i][0].test(text)) return text.replace(PAT[i][0], PAT[i][1][LANG]);
  }
  return text;
}

function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(function(e){ e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-ph]").forEach(function(e){ e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll(".langsel").forEach(function(e){ e.value = LANG; });
  document.documentElement.lang = LANG;
  document.title = t("title");
  updateTr();
  renderRooms();
  if(lastGame) showGame(lastGame);
}

function setLang(l){
  LANG = l;
  localStorage.setItem("lang", l);
  applyLang();
}

function screen(id){
  ["login","app"].forEach(function(x){
    $(x).style.display = (x == id) ? "flex" : "none";
  });
}

function auth(kind){
  var n = $("name").value.trim();
  var p = $("pass").value;
  fetch("/" + kind, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: n, password: p})
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.error){ $("lerr").textContent = srv(d.error); return; }
    tok = d.token; me = d.name;
    localStorage.setItem("tok", tok);
    localStorage.setItem("me", me);
    showApp();
  });
}

function showApp(){
  $("sme").textContent = "👤 " + me;
  screen("app");
  renderRooms();
}

function logout(){
  dropWs();
  localStorage.removeItem("tok");
  localStorage.removeItem("me");
  tok = null; me = null; curRoom = null;
  $("chat").style.display = "none";
  $("empty").style.display = "block";
  $("app").classList.remove("inchat");
  screen("login");
}

/* rooms list */
function saveRooms(){ localStorage.setItem("rooms", JSON.stringify(ROOMS)); }

function addRoom(){
  var r = $("room").value.trim();
  if(!r) return;
  $("room").value = "";
  if(ROOMS.indexOf(r) < 0){ ROOMS.unshift(r); saveRooms(); }
  openRoom(r);
}

function removeRoom(r){
  ROOMS = ROOMS.filter(function(x){ return x != r; });
  saveRooms();
  if(curRoom == r) closeRoom();
  renderRooms();
}

function renderRooms(){
  var box = $("rooms");
  if(!box) return;
  box.innerHTML = "";
  if(!ROOMS.length){
    var e = document.createElement("div");
    e.id = "noroom"; e.textContent = t("norooms");
    box.appendChild(e);
    return;
  }
  ROOMS.forEach(function(r){
    var d = document.createElement("div");
    d.className = "ri" + (r == curRoom ? " act" : "");
    var a = document.createElement("div");
    a.className = "ra"; a.textContent = r.charAt(0).toUpperCase();
    var n = document.createElement("div");
    n.className = "rn"; n.textContent = r;
    var x = document.createElement("button");
    x.className = "rx"; x.textContent = "✕";
    x.onclick = function(ev){ ev.stopPropagation(); removeRoom(r); };
    d.onclick = function(){ openRoom(r); };
    d.appendChild(a); d.appendChild(n); d.appendChild(x);
    box.appendChild(d);
  });
}

/* connection */
function dropWs(){
  if(ws){ var old = ws; ws = null; old.onclose = null; old.close(); }
}

function openRoom(room){
  dropWs();
  curRoom = room;
  got = false;
  lastGame = null;
  $("log").innerHTML = "";
  $("game").style.display = "none";
  $("lobby").style.display = "none";
  $("rtitle").textContent = "# " + room;
  $("empty").style.display = "none";
  $("chat").style.display = "flex";
  $("app").classList.add("inchat");
  renderRooms();
  var proto = location.protocol == "https:" ? "wss://" : "ws://";
  var mine = new WebSocket(proto + location.host + "/ws/" + encodeURIComponent(room) + "/" + tok);
  ws = mine;
  mine.onmessage = onmsg;
  mine.onclose = function(){
    if(ws !== mine) return;
    if(!got){
      logout();
      $("lerr").textContent = t("relogin");
    } else {
      addMsg({type: "system", text: t("lost")}, true);
    }
  };
}

function closeRoom(){
  dropWs();
  curRoom = null;
  $("chat").style.display = "none";
  $("empty").style.display = "block";
  $("app").classList.remove("inchat");
  renderRooms();
}

function onmsg(e){
  got = true;
  var m = JSON.parse(e.data);
  if(m.type == "game") showGame(m);
  else if(m.type == "lobby") showLobby(m);
  else if(m.type == "err"){
    if($("game").style.display == "block") $("gerr").textContent = srv(m.text);
    else addMsg({type: "system", text: m.text});
  }
  else addMsg(m);
}

function hhmm(ts){
  var d = ts ? new Date(ts) : new Date();
  if(isNaN(d.getTime())) d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function addMsg(m, raw){
  var log = $("log");
  if(m.type == "system"){
    var s = document.createElement("div");
    s.className = "sys"; s.textContent = raw ? m.text : srv(m.text);
    log.appendChild(s);
  } else {
    var mine = (m.name == me);
    var row = document.createElement("div");
    row.className = "row" + (mine ? " mine" : "");
    var b = document.createElement("div");
    b.className = "b" + (mine ? " me" : "");
    if(!mine){
      var av = document.createElement("div");
      av.className = "av"; av.textContent = m.avatar || "🙂";
      av.onclick = function(){ openProfile(m.name); };
      row.appendChild(av);
      var n = document.createElement("div");
      n.className = "n"; n.textContent = m.name;
      n.onclick = function(){ openProfile(m.name); };
      b.appendChild(n);
    }
    var mm = /^\[(img|vid)\](\/uploads\/[\w.\-]+)$/.exec(m.text);
    if(mm){
      var el = document.createElement(mm[1] == "img" ? "img" : "video");
      el.className = "media"; el.src = mm[2];
      var down = function(){ $("log").scrollTop = $("log").scrollHeight; };
      if(mm[1] == "vid"){ el.controls = true; el.preload = "metadata"; el.onloadedmetadata = down; }
      else { el.onclick = function(){ window.open(mm[2]); }; el.onload = down; }
      b.appendChild(el);
    } else {
      var tx = document.createElement("div");
      tx.className = "tx"; tx.textContent = m.text;
      b.appendChild(tx);
      if(!mine && TR && m.text.length <= 450){
        var trd = document.createElement("div");
        trd.className = "trn"; trd.style.display = "none";
        b.appendChild(trd);
        fetch("/translate?text=" + encodeURIComponent(m.text) + "&to=" + LANG)
          .then(function(r){ return r.json(); })
          .then(function(d){
            if(d.text && d.text.trim().toLowerCase() != m.text.trim().toLowerCase()){
              trd.textContent = d.text; trd.style.display = "block";
              $("log").scrollTop = $("log").scrollHeight;
            }
          }).catch(function(){});
      }
    }
    var tm = document.createElement("div");
    tm.className = "tm"; tm.textContent = hhmm(m.time || m.ts || m.created);
    b.appendChild(tm);
    row.appendChild(b);
    log.appendChild(row);
  }
  log.scrollTop = log.scrollHeight;
}

/* profile */
function openProfile(name){
  fetch("/profile/" + encodeURIComponent(name)).then(function(r){ return r.json(); }).then(function(p){
    if(p.error) return;
    $("pav").textContent = p.avatar;
    $("pname").textContent = p.name;
    $("pstat").textContent = p.online ? t("online") : t("offline");
    $("pbio").textContent = p.bio || t("nobio");
    var mine = (p.name == me);
    $("pedit").style.display = mine ? "block" : "none";
    $("pbio").style.display = mine ? "none" : "block";
    if(mine){
      chosen = p.avatar;
      $("bioin").value = p.bio;
      var pk = $("pick");
      pk.innerHTML = "";
      AVS.forEach(function(a){
        var sp = document.createElement("span");
        sp.className = "opt"; sp.textContent = a;
        sp.onclick = function(){ chosen = a; $("pav").textContent = a; };
        pk.appendChild(sp);
      });
    }
    $("modal").style.display = "flex";
  });
}

function closeP(){ $("modal").style.display = "none"; }

function saveP(){
  fetch("/profile", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({token: tok, avatar: chosen, bio: $("bioin").value})
  }).then(function(){ closeP(); });
}

/* durak */
function showLobby(m){
  var p = $("lobby");
  if(m.gone){ p.style.display = "none"; return; }
  p.style.display = "block";
  $("lplayers").textContent =
    m.players.map(function(n){ return (n == m.host ? "👑 " : "") + n; }).join(", ") +
    " (" + m.players.length + "/4)";
  var inL = m.players.indexOf(me) >= 0;
  $("bjoin").style.display = inL ? "none" : "block";
  $("bleave").style.display = inL ? "block" : "none";
  $("bstart").style.display = (m.host == me) ? "block" : "none";
}

function cardEl(c, click){
  var R = (LANG == "ru") ? RANKS_RU : RANKS;
  var d = document.createElement("div");
  d.className = "card" + (c[1] == 1 || c[1] == 2 ? " red" : "");
  d.textContent = R[c[0]] + SUITS[c[1]];
  if(click) d.onclick = click;
  return d;
}

function showGame(g){
  var p = $("game");
  if(g.gone){ lastGame = null; p.style.display = "none"; return; }
  lastGame = g;
  p.style.display = "block";
  $("gerr").textContent = "";
  var parts = g.others.map(function(o){
    return (o.name == g.attacker ? "🗡" : "") + (o.name == g.defender ? "🛡" : "") +
           o.name + ": " + (o.out ? "✅" : o.n + t("cards"));
  });
  $("gtop").textContent =
    parts.join(" | ") + " | " + t("deck") + g.deck_n + " | " + t("trump") + SUITS[g.trump];
  var tb = $("gtable"); tb.innerHTML = "";
  g.table.forEach(function(pr){
    var w = document.createElement("div"); w.className = "pair";
    w.appendChild(cardEl(pr[0]));
    if(pr[1]){ var c = cardEl(pr[1]); c.className += " over"; w.appendChild(c); }
    tb.appendChild(w);
  });
  var h = $("ghand"); h.innerHTML = "";
  g.hand.forEach(function(c){
    h.appendChild(cardEl(c, function(){ act(g.defender == me ? "defend" : "attack", c); }));
  });
  var st;
  if(g.over) st = srv(g.msg);
  else if(g.out) st = t("outs");
  else if(g.defender == me) st = t("def");
  else if(g.attacker == me) st = t("att");
  else st = t("help");
  if(!g.over && g.msg) st += " (" + srv(g.msg) + ")";
  $("gstatus").textContent = st;
  var active = !g.over && !g.out;
  $("btake").style.display = (active && g.defender == me) ? "block" : "none";
  $("bdone").style.display = (active && g.defender != me) ? "block" : "none";
}

function send(){
  var i = $("msg");
  if(ws && i.value){ ws.send(JSON.stringify({type: "msg", text: i.value})); i.value = ""; }
}

function updateTr(){
  var b = $("trbtn");
  if(b) b.textContent = TR ? "🌐 ✓" : "🌐 ✗";
}

function toggleTr(){
  TR = !TR;
  localStorage.setItem("tr", TR ? "1" : "0");
  updateTr();
}

function upload(inp){
  var f = inp.files[0]; inp.value = "";
  if(!f || !ws) return;
  if(f.size > 25 * 1024 * 1024){ addMsg({type: "system", text: t("big")}, true); return; }
  addMsg({type: "system", text: t("sending")}, true);
  fetch("/upload?token=" + encodeURIComponent(tok), {
    method: "POST", headers: {"Content-Type": f.type}, body: f
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.error){ addMsg({type: "system", text: t("upfail")}, true); return; }
    if(ws) ws.send(JSON.stringify({type: "msg", text: (d.kind == "img" ? "[img]" : "[vid]") + d.url}));
  }).catch(function(){ addMsg({type: "system", text: t("upfail")}, true); });
}

function act(action, card){
  if(ws) ws.send(JSON.stringify({type: "game", action: action, card: card || null}));
}

document.addEventListener("keydown", function(e){
  if(e.key != "Enter") return;
  if(document.activeElement == $("msg")) send();
  else if(document.activeElement == $("room")) addRoom();
});

applyLang();
if(tok && me) showApp(); else screen("login");
</script></body></html>
