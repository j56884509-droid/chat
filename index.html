<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
:root{--bg:#0e1621;--panel:#17212b;--panel2:#242f3d;--hover:#202b36;--act:#2b5278;--bubble:#182533;--mine:#2b5278;--text:#fff;--sub:#8899aa;--accent:#2b95e0;--link:#6ab3f3;--border:#0b121a;--btnalt:#2b3a4a;--tick:#9cc3e6}
[data-theme=light]{--bg:#e6ebee;--panel:#fff;--panel2:#f0f2f5;--hover:#f1f3f5;--act:#cfe4f7;--bubble:#fff;--mine:#e1f4d2;--text:#111;--sub:#707a84;--accent:#2b95e0;--link:#1a78c2;--border:#d6dbe0;--btnalt:#dfe4e9;--tick:#4fae4e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column}
input,button,textarea,select{padding:12px;border-radius:10px;border:0;font-size:16px;font-family:inherit}
button{background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:var(--btnalt);color:var(--text)}
input,textarea{background:var(--panel2);color:var(--text)}
.screen{margin:auto;display:flex;flex-direction:column;gap:10px;width:80%;max-width:320px}
.langsel{padding:6px;font-size:14px;background:var(--btnalt);color:var(--text)}
#lerr{color:#ffb4b4;font-size:14px;min-height:18px}

#app{display:none;flex:1;min-height:0}
#side{width:330px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#shead{display:flex;align-items:center;gap:6px;padding:10px}
#sme{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#shead button{padding:6px 10px;font-size:14px}
#snew{display:flex;gap:6px;padding:0 10px 10px}
#room{flex:1;min-width:0;padding:10px}
#snew button{padding:10px 14px}
#usearch{margin:0 10px 8px;padding:10px;width:calc(100% - 20px)}
#rooms{flex:1;overflow:auto}
.ri{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.ri:hover{background:var(--hover)}
.ri.act{background:var(--act)}
.ra{width:50px;height:50px;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,#5ab0f0,#2b6cb0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;flex:none}
.rmid{flex:1;min-width:0}
.rl1,.rl2{display:flex;align-items:center;gap:6px}
.rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rtm{font-size:12px;color:var(--sub);flex:none}
.rlast{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:14px;margin-top:2px}
.bdg{background:var(--accent);color:#fff;font-size:12px;font-weight:600;border-radius:10px;min-width:20px;padding:1px 6px;text-align:center;flex:none}
.bdg.mut{background:#6b7885}
.rx{background:none;color:var(--sub);padding:0 4px;font-size:12px;flex:none}
#noroom{padding:16px;color:var(--sub);font-size:14px}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#empty{margin:auto;color:var(--sub);background:var(--panel);padding:6px 14px;border-radius:14px;font-size:14px}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel)}
#back{display:none;background:none;color:var(--text);padding:6px 10px;font-size:20px}
#tbox{flex:1;min-width:0;cursor:pointer}
#rtitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rsub{font-size:13px;color:var(--sub);min-height:16px}
#top button.pb{padding:6px 9px;font-size:15px}
#sbar{display:none;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border)}
#sq{flex:1;min-width:0;padding:8px 12px}

#log{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:80px;background:var(--bg)}
.row{display:flex;gap:6px;align-items:flex-end;max-width:80%;align-self:flex-start}
.mine{align-self:flex-end;flex-direction:row-reverse}
.av{font-size:26px;cursor:pointer}
.b{padding:6px 10px 4px;border-radius:14px 14px 14px 4px;background:var(--bubble);word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.me{background:var(--mine);border-radius:14px 14px 4px 14px}
.b.flash{outline:2px solid var(--accent)}
.n{font-size:13px;font-weight:600;color:var(--link);cursor:pointer;margin-bottom:2px}
.tx{white-space:pre-wrap}
.tx.del{color:var(--sub);font-style:italic}
.quote{border-left:3px solid var(--link);background:rgba(127,127,127,.14);border-radius:4px;padding:2px 8px;margin-bottom:4px;font-size:13px;cursor:pointer;overflow:hidden}
.quote b{display:block;color:var(--link);font-weight:600}
.quote span{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.media{display:block;width:260px;max-width:100%;border-radius:10px;cursor:pointer;background:var(--bg)}
audio.media{width:240px;height:40px;cursor:default;background:none}
.tm{font-size:11px;color:var(--sub);text-align:right;margin-top:2px;display:flex;gap:4px;justify-content:flex-end;align-items:center}
.mn{cursor:pointer;padding:0 3px;font-size:13px;opacity:.7}
.tk{color:var(--sub)}
.tk.rd{color:var(--tick)}
.sys{align-self:center;color:var(--sub);font-size:13px;text-align:center;background:var(--bubble);padding:3px 10px;border-radius:12px}

#menu{display:none;position:fixed;z-index:20;flex-direction:column;background:var(--panel);border-radius:12px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.35);min-width:160px}
#menu button{background:none;color:var(--text);text-align:left;padding:10px 12px;font-size:15px}
#menu button:hover{background:var(--hover)}

#rbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border)}
#rtxt{flex:1;min-width:0;border-left:3px solid var(--link);padding-left:8px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
#rbar button{background:none;color:var(--sub);padding:4px 8px}
#emo{display:none;flex-wrap:wrap;gap:2px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--border);max-height:120px;overflow:auto}
#emo span{font-size:24px;cursor:pointer;padding:2px 4px}

#bar{display:flex;gap:6px;padding:8px;background:var(--panel);align-items:center}
#msg{flex:1;min-width:0;border-radius:20px;padding:11px 16px}
#bar button{border-radius:50%;width:40px;height:40px;padding:0;font-size:18px;flex:none}
#bar button.alt{font-size:19px;background:none}
#bmain.rec{background:#d33}
#rcancel{display:none;background:var(--btnalt)}

#lobby{display:none;background:#243b55;color:#fff;padding:8px 12px}
#lbtn{display:flex;gap:8px;margin-top:6px}
#lbtn button{flex:1;padding:8px}
#game{display:none;background:#1b5e3a;color:#fff;padding:8px 12px;max-height:55vh;overflow:auto}
#gtop,#gstatus{font-size:14px;margin-bottom:4px}
#gerr{color:#ffb4b4;font-size:13px;min-height:16px}
#gtable{min-height:70px}
.pair{display:inline-flex;flex-direction:column;align-items:center;margin:4px 8px}
.card{display:inline-block;background:#fff;color:#000;border-radius:8px;padding:8px 6px;margin:3px;font-weight:bold;min-width:42px;text-align:center}
.red{color:#d22}
.over{margin-top:-14px;border:2px solid #2b95e0}
#ghand{overflow-x:auto;white-space:nowrap}
#gbtn{display:flex;gap:8px;margin-top:6px}
#gbtn button{flex:1;padding:8px}

#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:10}
#card{background:var(--panel);border-radius:16px;padding:18px;width:85%;max-width:340px;display:flex;flex-direction:column;gap:10px;text-align:center}
#pav{font-size:64px;display:flex;justify-content:center}
#pbio{color:var(--sub)}
#pedit{display:none}
#pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.opt{font-size:28px;cursor:pointer;padding:2px 4px}
#bioin{width:100%;height:70px;margin-bottom:8px}

@media(max-width:700px){
  #side{width:100%;border-right:0}
  #main{display:none}
  #app.inchat #side{display:none}
  #app.inchat #main{display:flex}
  #back{display:block}
  .row{max-width:90%}
}

/* ===== Telegram look ===== */
:root{--bg:#0e1621}
#side{position:relative}
#shead{padding:8px 10px;gap:10px;background:var(--panel)}
.ic{background:none!important;color:var(--sub)!important;font-size:22px!important;padding:6px 10px!important;border-radius:50%!important}
#sme{font-size:19px;font-weight:600;cursor:pointer}
#usearch{border-radius:22px;padding:10px 16px;background:var(--panel2)}
#rooms{padding-bottom:90px}
#fab{position:absolute;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:22px;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:5}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:15}
.dlg{background:var(--panel);border-radius:16px;padding:18px;width:85%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0 0 4px}
.dlg input{width:100%}
#top{padding:6px 10px;gap:10px;min-height:58px;box-shadow:0 1px 0 var(--border)}
#back{color:var(--sub)}
#tav{width:42px;height:42px;font-size:18px;cursor:pointer}
#tbox{display:flex;flex-direction:column;justify-content:center}
#log{background:linear-gradient(165deg,#0e1621 0%,#14212f 100%)}
[data-theme=light] #main,[data-theme=light] #log{background:linear-gradient(165deg,#d5e5c4 0%,#a9cbbd 100%)}
.b{padding:6px 9px 6px 11px;border-radius:12px 12px 12px 3px;box-shadow:0 1px 1px rgba(0,0,0,.2);line-height:1.35}
.me{border-radius:12px 12px 3px 12px}
.bd,.tx{display:inline}
.tm{float:right;margin:8px 0 -3px 12px;font-size:11px}
.b::after{content:"";display:block;clear:both}
.mn{display:none}
.b:hover .mn{display:inline}
.dsep{align-self:center;background:rgba(60,72,84,.6);color:#fff;font-size:13px;padding:3px 12px;border-radius:14px;margin:6px 0}
#menu{min-width:210px}
#bar{padding:8px 10px;gap:8px;align-items:flex-end}
#pill{flex:1;min-width:0;display:flex;align-items:center;background:var(--panel2);border-radius:22px;padding:0 4px}
#pill button{background:none;color:var(--sub);width:38px;height:42px;font-size:21px;padding:0;border-radius:0;flex:none}
#bar #msg{background:none;border-radius:0;padding:11px 4px}
#bmain{width:46px!important;height:46px!important;font-size:20px!important}
#rcancel{width:46px!important;height:46px!important}
#card{max-height:90vh;overflow:auto}
#punm{color:var(--sub);font-size:14px;margin-top:-6px}
#pact{display:flex;gap:8px}
#pact button{flex:1;padding:10px}
#dnin{width:100%;margin-bottom:8px}
.lbl{display:block;text-align:left;font-size:13px;color:var(--sub);margin-bottom:4px}
#seenin{width:100%;background:var(--panel2);color:var(--text);margin-bottom:8px}
#blist{text-align:left;font-size:14px;color:var(--sub)}
#blist .bi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;color:var(--text)}
#blist .bi button{padding:6px 10px;font-size:13px}

/* ===== Settings panel ===== */
#sp{display:none;position:fixed;inset:0;z-index:12;background:var(--bg);flex-direction:column}
#sph{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);min-height:58px;box-shadow:0 1px 0 var(--border)}
#spt{flex:1;font-size:19px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#spc{flex:1;overflow:auto;padding-bottom:40px;width:100%;max-width:640px;margin:0 auto}
.sec{background:var(--panel);margin-top:10px;overflow:hidden}
.sh{padding:14px 16px 6px;color:var(--accent);font-weight:600;font-size:15px}
.sr{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
.sr:hover{background:var(--hover)}
.si{width:26px;text-align:center;font-size:20px;flex:none}
.sx{flex:1;min-width:0}
.sl{font-size:16px;overflow-wrap:anywhere}
.ss{font-size:13px;color:var(--sub);margin-top:2px}
.sv{color:var(--accent);font-size:15px;flex:none}
.sr.dng .sl{color:#e5534b}
.sn{padding:10px 16px;font-size:13px;color:var(--sub)}
.tg{width:42px;height:24px;border-radius:12px;background:#667;position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--accent)}
.tg.on::after{left:20px}
.sld{padding:6px 16px 16px;display:flex;align-items:center;gap:14px}
.sld input{flex:1;padding:0;background:none}
.sld b{min-width:30px;text-align:right;color:var(--accent)}
.spro{text-align:center;padding:22px 10px 14px;background:var(--panel)}
.spro .ra{margin:0 auto 10px;cursor:pointer}
.spn{font-size:20px;font-weight:600}
.sps{color:var(--sub);font-size:14px;margin-top:2px}
.sprev{display:flex;flex-direction:column;gap:6px;padding:16px 12px}
.sprev .b{max-width:80%}
.sprev .me{align-self:flex-end}
.chips{display:flex;gap:12px;padding:10px 16px 16px;overflow-x:auto}
.chp{width:44px;height:44px;border-radius:50%;border:3px solid transparent;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.chp.sq{border-radius:10px}
.chp.on{border-color:var(--accent)}
.apick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;justify-content:center}
.sf{padding:8px 16px}
.sf input,.sf textarea{width:100%;margin-bottom:4px}
.sbtn{padding:12px 16px}
.sbtn button{width:100%;margin-bottom:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:16px;z-index:30;font-size:14px}
#ftabs{display:none;gap:6px;overflow-x:auto;padding:0 10px 8px;white-space:nowrap}
.ft{padding:6px 14px;border-radius:16px;background:var(--panel2);color:var(--sub);cursor:pointer;font-size:14px;flex:none}
.ft.on{background:var(--accent);color:#fff}
.l3 .rlast{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.b{font-size:var(--fs,16px);border-radius:var(--rad,12px) var(--rad,12px) var(--rad,12px) 3px}
.me{border-radius:var(--rad,12px) var(--rad,12px) 3px var(--rad,12px)}

/* ===== B-paket ===== */
#pinbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border);cursor:pointer}
#pintxt{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxs{display:none;flex-wrap:wrap;gap:4px;clear:both;padding-top:4px}
.rc{background:rgba(127,127,127,.22);border-radius:12px;padding:2px 8px;font-size:13px;cursor:pointer;user-select:none}
.rc.on{background:var(--accent);color:#fff}
.fwd{font-size:13px;color:var(--link);margin-bottom:3px}
.mrow{display:flex;flex-wrap:wrap;gap:2px;padding:4px}
#menu .mrow button{padding:4px 6px;font-size:21px;min-width:0;background:none}
a.doc{display:flex;align-items:center;gap:10px;padding:4px 2px;color:inherit;text-decoration:none;min-width:190px}
a.doc .di{font-size:32px}
a.doc .dn{font-weight:600;overflow-wrap:anywhere}
a.doc .ds{font-size:12px;color:var(--sub)}
#trprev{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border)}
#trtxt{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;font-size:14px;cursor:pointer;overflow-wrap:anywhere}
#trprev button{font-size:16px!important;padding:2px 8px!important}
#gx{color:#fff;text-align:center}
.gxh{font-size:14px;margin-bottom:6px}
.gxs{font-size:15px;font-weight:600;margin:8px 0}
.xo{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:8px 0}
.xo button{height:64px;font-size:30px;font-weight:700;background:#164b2e;color:#fff;padding:0}
.xo button.win{background:#2e8b57}
.xo .mx{color:#ffd166}.xo .mo{color:#8ecae6}
.rpsb{display:flex;gap:10px;justify-content:center;margin:8px 0}
.rpsb button{font-size:34px;width:74px;height:74px;background:#164b2e;padding:0}
.rpsb button.sel{background:#2e8b57;outline:2px solid #fff}
#gxerr{color:#ffb4b4;font-size:13px;min-height:16px}
</style></head><body>

</div>

</div>
</div>

<div id="card">
<div id="pav"></div>

function t(k){ return T[LANG][k]; }
function $(id){ return document.getElementById(id); }
function enc(s){ return encodeURIComponent(s); }
function dn(x){ return x.display || x.name; }

function srv(text){
  if(LANG == "uz") return text;
  if(SRV[LANG][text]) return SRV[LANG][text];
  for(var i = 0; i < PAT.length; i++){
    if(PAT[i][0].test(text)) return text.replace(PAT[i][0], PAT[i][1][LANG]);
  }
  return text;
}

function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(function(e){ e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-ph]").forEach(function(e){ e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll(".langsel").forEach(function(e){ e.value = LANG; });
  document.documentElement.lang = LANG;
  document.title = t("title");
  updateTr();
  renderRooms();
  if(lastGame) showGame(lastGame);
  if(lastLobby) showLobby(lastLobby);
  if($("sp") && $("sp").style.display == "flex") spRender();
}

function setLang(l){
  LANG = l;
  localStorage.setItem("lang", l);
  applyLang();
}

function applyTheme(){
  document.documentElement.setAttribute("data-theme", THEME);
  applyAppearance();
}

function toggleTheme(){
  THEME = THEME == "dark" ? "light" : "dark";
  localStorage.setItem("theme", THEME);
  applyTheme();
}

function screen(id){
  ["login","app"].forEach(function(x){
    $(x).style.display = (x == id) ? "flex" : "none";
  });
}

function auth(kind){
  var n = $("name").value.trim();
  var p = $("pass").value;
  fetch("/" + kind, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: n, password: p})
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.error){ $("lerr").textContent = srv(d.error); return; }
    tok = d.token; me = d.name;
    localStorage.setItem("tok", tok);
    localStorage.setItem("me", me);
    showApp();
  });
}

function showApp(){
  $("sme").textContent = me;
  loadMe();
  screen("app");
  renderRooms();
  loadChats();
  autoNight();
  connectUsock();
  tryJoin();
  clearInterval(pollT);
  pollT = setInterval(poll, 4000);
}

function logout(){
  dropWs();
  clearInterval(pollT);
  clearTimeout(usockT);
  if(usock){ var uo = usock; usock = null; uo.onclose = null; uo.close(); }
  LAST_UN = null; ME_PROF = null;
  document.title = t("title");
  localStorage.removeItem("tok");
  localStorage.removeItem("me");
  tok = null; me = null; curRoom = null; CHATS = {dms: [], rooms: {}}; NEWDM = [];
  $("chat").style.display = "none";
  $("empty").style.display = "block";
  $("app").classList.remove("inchat");
  screen("login");
}

/* ---------- chat list ---------- */
function saveRooms(){ localStorage.setItem("rooms", JSON.stringify(ROOMS)); }

function addRoom(){
  var r = $("room").value.trim();
  if(!r) return;
  $("room").value = "";
  $("nrm").style.display = "none";
  post("/group", {title: r}).then(function(d){
    if(d && d.room) loadChats(function(){ openRoom(d.room); });
  }).catch(function(){});
}

function removeRoom(r){
  ROOMS = ROOMS.filter(function(x){ return x != r; });
  saveRooms();
  if(curRoom == r) closeRoom();
  renderRooms();
}

function dmRoom(other){ return "dm:" + [me, other].sort().join("|"); }
function isDm(){ return !!curRoom && curRoom.indexOf("dm:") == 0; }
function dmOther(room){
  var p = room.slice(3).split("|");
  return p[0] == me ? p[1] : p[0];
}

function loadMe(){
  fetch("/profile/me?token=" + enc(tok)).then(function(r){ return r.json(); }).then(function(p){
    if(p && !p.error) $("sme").textContent = p.display || p.name;
  }).catch(function(){});
}

function loadChats(cb){
  if(!tok) return;
  fetch("/chats?token=" + enc(tok) + "&rooms=" + enc(JSON.stringify(ROOMS)))
    .then(function(r){ return r.json(); }).then(function(d){
      if(!d || d.error || !d.dms) return;
      CHATS = d;
      NEWDM = NEWDM.filter(function(u){ return !d.dms.some(function(x){ return x.name == u.name; }); });
      checkNotify();
      renderRooms();
      if(cb) cb();
    }).catch(function(){});
}

function poll(){
  if(!tok) return;
  autoNight();
  loadChats();
  if(isDm()) refreshStatus();
}

function openDm(u){
  if(!CHATS.dms.some(function(x){ return x.name == u.name; }) &&
     !NEWDM.some(function(x){ return x.name == u.name; })) NEWDM.push(u);
  $("usearch").value = "";
  $("sres").innerHTML = "";
  openRoom(dmRoom(u.name));
}

function searchUsers(){
  clearTimeout(window.sTimer);
  var q = $("usearch").value.trim();
  if(!q){ $("sres").innerHTML = ""; return; }
  window.sTimer = setTimeout(function(){
    fetch("/users?q=" + enc(q) + "&token=" + enc(tok))
      .then(function(r){ return r.json(); }).then(function(l){
        var box = $("sres"); box.innerHTML = "";
        if(!Array.isArray(l)) return;
        l.forEach(function(u){
          var d = document.createElement("div"); d.className = "ri";
          var a = document.createElement("div"); a.className = "ra"; setAv(a, u.avatar, 50);
          var n = document.createElement("div"); n.className = "rn"; n.textContent = dn(u);
          d.onclick = function(){ openDm(u); };
          d.appendChild(a); d.appendChild(n);
          box.appendChild(d);
        });
      }).catch(function(){});
  }, 300);
}

function snip(text){
  text = text || "";
  var m = MEDIA.exec(text);
  if(m) return t(m[1] == "img" ? "sphoto" : m[1] == "vid" ? "svideo" : "svoice");
  var dd = DOC.exec(text);
  if(dd) return "📄 " + dd[2];
  return text.slice(0, 80);
}

function fmtTime(ts){
  if(!ts) return "";
  var d = new Date(ts), n = new Date();
  if(d.toDateString() == n.toDateString()) return hhmm(ts);
  return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2);
}

function lastText(x){
  var l = x.last;
  if(!l) return "";
  var body = l.deleted ? "🚫 " + t("deleted") : snip(l.text);
  if(l.name == me) return t("you") + ": " + body;
  return (x.dm ? "" : (l.display || l.name) + ": ") + body;
}

function chatItems(){
  var items = [], seen = {};
  CHATS.dms.forEach(function(d){
    seen[d.name] = 1;
    var sv = (d.name == me);
    var ai = (d.name == AI_USER);
    items.push({room: dmRoom(d.name), title: sv ? t("saved") : (ai ? L("aifriend") : dn(d)), avatar: sv ? "🔖" : (ai ? "🤖" : d.avatar), dm: true, last: d.last, unread: sv ? 0 : d.unread});
  });
  NEWDM.forEach(function(u){
    if(!seen[u.name]) items.push({room: dmRoom(u.name), title: dn(u), avatar: u.avatar, dm: true, last: null, unread: 0});
  });
  if(!seen[me]) items.push({room: dmRoom(me), title: t("saved"), avatar: "🔖", dm: true, last: null, unread: 0});
  if(CHATS.ai && !seen[AI_USER]) items.push({room: dmRoom(AI_USER), title: L("aifriend"), avatar: "🤖", dm: true, last: null, unread: 0});
  (CHATS.groups || []).forEach(function(g){
    items.push({room: g.room, title: g.title, avatar: g.avatar, dm: false, grp: true, gid: g.gid, role: g.role, n: g.n, last: g.last, unread: g.unread});
  });
  ROOMS.forEach(function(r){
    var i = CHATS.rooms[r] || {};
    items.push({room: r, title: r, dm: false, last: i.last || null, unread: i.unread || 0});
  });
  items.forEach(function(x){ if(x.room == curRoom) x.unread = 0; });
  items.sort(function(a, b){
    var pa = PINS.indexOf(a.room) >= 0 ? 1 : 0, pb = PINS.indexOf(b.room) >= 0 ? 1 : 0;
    if(pa != pb) return pb - pa;
    return ((b.last && b.last.time) || 0) - ((a.last && a.last.time) || 0);
  });
  return items;
}

function renderRooms(){
  var box = $("rooms");
  if(!box) return;
  box.innerHTML = "";
  renderFolderTabs();
  var items = folderFilter(chatItems());
  if(!items.length){
    var e = document.createElement("div");

  items.forEach(function(x){
    var muted = MUTES.indexOf(x.room) >= 0, pinned = PINS.indexOf(x.room) >= 0;
    var d = document.createElement("div");
    d.className = "ri" + (x.room == curRoom ? " act" : "");
    var a = document.createElement("div");
    a.className = "ra";
    if(x.dm || x.grp) setAv(a, x.avatar, 50); else a.textContent = x.title.charAt(0).toUpperCase();
    var mid = document.createElement("div"); mid.className = "rmid";
    var l1 = document.createElement("div"); l1.className = "rl1";
    var n = document.createElement("span"); n.className = "rn"; n.textContent = x.title;
    l1.appendChild(n);
    if(muted){ var mu = document.createElement("span"); mu.className = "rtm"; mu.textContent = "🔕"; l1.appendChild(mu); }
    if(pinned){ var pi = document.createElement("span"); pi.className = "rtm"; pi.textContent = "📌"; l1.appendChild(pi); }
    var tm = document.createElement("span"); tm.className = "rtm"; tm.textContent = fmtTime(x.last && x.last.time);
    l1.appendChild(tm);
    if(!x.dm && !x.grp){
      var rx = document.createElement("button");
      rx.className = "rx"; rx.textContent = "✕";
      rx.onclick = function(ev){ ev.stopPropagation(); removeRoom(x.room); };
      l1.appendChild(rx);
    }
    var l2 = document.createElement("div"); l2.className = "rl2";

    l2.appendChild(lt);
    if(x.unread > 0){

      bd.className = "bdg" + (muted ? " mut" : "");

    }
    mid.appendChild(l1); mid.appendChild(l2);
    d.onclick = function(){ openRoom(x.room); };

    box.appendChild(d);
  });
  updateHeaderBtns();
}

function toggleIn(arr, key, v){
  var i = arr.indexOf(v);
  if(i < 0) arr.push(v); else arr.splice(i, 1);
  localStorage.setItem(key, JSON.stringify(arr));
}
function togglePin(){ if(!curRoom) return; toggleIn(PINS, "pins", curRoom); updateHeaderBtns(); renderRooms(); }
function toggleMute(){ if(!curRoom) return; toggleIn(MUTES, "mutes", curRoom); updateHeaderBtns(); renderRooms(); }
function dmTitle(room){
  var o = dmOther(room);
  if(o == me) return t("saved");
  if(o == AI_USER) return L("aifriend");
  var u = CHATS.dms.concat(NEWDM).filter(function(x){ return x.name == o; })[0];
  return u ? dn(u) : o;
}

function updateHeaderBtns(){
  var a = $("tav");
  if(!a || !curRoom) return;
  if(isDm()){
    var o = dmOther(curRoom);
    var u = CHATS.dms.concat(NEWDM).filter(function(x){ return x.name == o; })[0];
    setAv(a, o == me ? "🔖" : (o == AI_USER ? "🤖" : (u ? u.avatar : "🙂")), 42);
    $("rtitle").textContent = dmTitle(curRoom);
  } else if(groupOf(curRoom)){
    var g = groupOf(curRoom);
    setAv(a, g.avatar, 42);
    $("rtitle").textContent = g.title;
    subBase = g.n + " " + L("members");
    updateSub();
  } else a.textContent = curRoom.charAt(0).toUpperCase();
}

function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function dayLabel(ts){
  var d = new Date(ts), n = new Date(), y = new Date(Date.now() - 86400000);
  if(dayKey(ts) == dayKey(n.getTime())) return t("today");
  if(dayKey(ts) == dayKey(y.getTime())) return t("yday");
  return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + "." + d.getFullYear();
}

function popup(items, ev){

}

function newRoomDlg(){

}

/* ---------- connection ---------- */
function dropWs(){
  stopRec(false);
  if(ws){ var old = ws; ws = null; old.onclose = null; old.close(); }
}

function titleClick(){
  if(isDm() && dmOther(curRoom) != me) openProfile(dmOther(curRoom));
  else if(groupOf(curRoom)) openGroupInfo();
}

function updateSub(){
  $("rsub").textContent = typingName ? (isDm() ? t("typing") : typingName + " " + t("typing")) : subBase;
}

function refreshStatus(){
  if(!isDm() || dmOther(curRoom) == me) return;
  var o = dmOther(curRoom);
  fetch("/profile/" + enc(o) + "?token=" + enc(tok)).then(function(r){ return r.json(); }).then(function(p){
    if(p.error || !isDm() || dmOther(curRoom) != o) return;
    subBase = statusText(p);
    updateSub();
  }).catch(function(){});
}

function showTyping(name){
  typingName = name;
  updateSub();
  clearTimeout(typTimer);
  typTimer = setTimeout(function(){ typingName = ""; updateSub(); }, 3000);
}

function openRoom(room){
  dropWs();
  curRoom = room;
  got = false;
  lastGame = null;
  MSGS = {}; OTHER_READ = 0; LASTID = 0; SENT_READ = 0; LASTDAY = ""; LIVE = false;
  typingName = ""; subBase = "";
  setPin(null);
  trPrevHide();
  cancelReply();
  closeSearch();
  $("emo").style.display = "none";
  $("log").innerHTML = "";
  $("game").style.display = "none";
  $("lobby").style.display = "none";
  $("rtitle").textContent = isDm() ? dmTitle(room) : (groupOf(room) ? groupOf(room).title : "# " + room);
  updateSub();
  $("empty").style.display = "none";
  $("chat").style.display = "flex";
  $("app").classList.add("inchat");
  updateHeaderBtns();
  updateMainBtn();
  renderRooms();
  if(isDm()) refreshStatus();
  var proto = location.protocol == "https:" ? "wss://" : "ws://";
  var mine = new WebSocket(proto + location.host + "/ws/" + enc(room) + "/" + tok);
  ws = mine;
  mine.onmessage = onmsg;
  mine.onclose = function(){
    if(ws !== mine) return;
    if(!got){
      logout();
      $("lerr").textContent = t("relogin");
    } else {
      addMsg({type: "system", text: t("lost")}, true);
    }
  };
}

function closeRoom(){
  dropWs();
  curRoom = null;
  $("chat").style.display = "none";
  $("empty").style.display = "block";
  $("app").classList.remove("inchat");
  renderRooms();
  loadChats();
}

function onmsg(e){
  got = true;
  var m = JSON.parse(e.data);
  if(m.type == "game") showGame(m);
  else if(m.type == "lobby") showLobby(m);
  else if(m.type == "err"){
    if($("game").style.display == "block"){ $("gerr").textContent = srv(m.text); if($("gxerr")) $("gxerr").textContent = srv(m.text); }
    else addMsg({type: "system", text: m.text});
  }
  else if(m.type == "reads"){
    var mx = 0;
    for(var k in m.reads){ if(k != me && m.reads[k] > mx) mx = m.reads[k]; }
    OTHER_READ = mx; updateTicks(); LIVE = true;
  }
  else if(m.type == "read"){
    if(m.name != me && m.upto > OTHER_READ){ OTHER_READ = m.upto; updateTicks(); }
  }
  else if(m.type == "typing") showTyping(m.display || m.name);
  else if(m.type == "edit"){
    var r = MSGS[m.id];
    if(r){ r.m.text = m.text; r.m.edited = 1; buildBody(r); }
  }
  else if(m.type == "del"){
    var r2 = MSGS[m.id];
    if(r2){ r2.m.deleted = 1; r2.m.text = ""; buildBody(r2); }
  }
  else if(m.type == "react"){
    var r3 = MSGS[m.id];
    if(r3){ r3.m.reactions = m.reactions; renderReactions(r3); }
  }
  else if(m.type == "pin") setPin(m.msg);
  else {
    addMsg(m);
    if(m.type == "msg"){
      if(dn(m) == typingName){ typingName = ""; updateSub(); }
      if(m.id){
        if(m.id > LASTID) LASTID = m.id;
        if(m.name != me){ markReadSoon(); if(LIVE && PREF.nChat) beep(660); }
      }
    }
  }
}

function markReadSoon(){
  clearTimeout(readT);
  readT = setTimeout(function(){
    if(ws && LASTID > SENT_READ && document.visibilityState == "visible"){
      ws.send(JSON.stringify({type: "read", upto: LASTID}));
      SENT_READ = LASTID;
      setTimeout(loadChats, 500);
    }
  }, 300);
}

/* ---------- messages ---------- */
function hhmm(ts){
  if(!ts) return "";
  var d = new Date(ts);
  if(isNaN(d.getTime())) return "";
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function scrollDown(){ var l = $("log"); l.scrollTop = l.scrollHeight; }

function note(text){
  var s = document.createElement("div");
  s.className = "sys"; s.textContent = text;
  $("log").appendChild(s);
  scrollDown();
  return s;
}

function flags(rec){
  if(rec.fl) rec.fl.textContent = (rec.m.edited ? "✏️ " : "") + (rec.trFail ? "⚠ " : "") + (rec.translated ? "🌐" : "");
}

function tickOne(rec){
  if(!rec.tk) return;
  if(!rec.mine || !rec.m.id || rec.m.deleted || (isDm() && dmOther(curRoom) == me)){ rec.tk.textContent = ""; return; }
  var rd = rec.m.id <= OTHER_READ;
  rec.tk.textContent = rd ? "✓✓" : "✓";
  rec.tk.className = "tk" + (rd ? " rd" : "");
}

function updateTicks(){ for(var k in MSGS) tickOne(MSGS[k]); }

function fillText(rec){
  var m = rec.m, tx = rec.tx;
  tx.textContent = m.text;
  tx.style.cursor = ""; tx.onclick = null;
  rec.translated = false; rec.trText = null; rec.trFail = false;
  if(rec.fl){ rec.fl.style.cursor = ""; rec.fl.onclick = null; rec.fl.title = ""; }
  flags(rec);
  var cfg = trCfg(curRoom);
  if(rec.mine || m.text.length > 450 || !(cfg.on || rec.forceTr)) return;
  var cur = m.text;
  tx.style.opacity = ".55";
  fetch("/translate?text=" + enc(cur) + "&to=" + cfg.to)
    .then(function(r){ return r.json(); })
    .then(function(d){
      tx.style.opacity = "";
      if(rec.m.text !== cur) return;
      if(d.ok === false){ trFailed(rec); return; }
      if(d.text && d.text.trim().toLowerCase() != cur.trim().toLowerCase()){
        rec.trText = d.text; rec.translated = true;
        tx.textContent = d.text;
        tx.style.cursor = "pointer";
        tx.onclick = function(){
          rec.translated = !rec.translated;
          tx.textContent = rec.translated ? rec.trText : rec.m.text;
          flags(rec);
        };
        flags(rec);
        if(rec.stick) scrollDown();
      }
    }).catch(function(){ tx.style.opacity = ""; trFailed(rec); });
}
function trFailed(rec){
  rec.trFail = true;
  flags(rec);
  if(rec.fl){
    rec.fl.style.cursor = "pointer"; rec.fl.title = L("trfail");
    rec.fl.onclick = function(ev){ ev.stopPropagation(); fillText(rec); };
  }
}

function buildBody(rec){
  var m = rec.m, body = rec.body;
  body.innerHTML = "";
  rec.tx = null;
  if(m.deleted){
    var d = document.createElement("div");
    d.className = "tx del"; d.textContent = "🚫 " + t("deleted");
    body.appendChild(d);
    flags(rec); tickOne(rec);
    return;
  }
  var mm = MEDIA.exec(m.text);
  if(mm && mm[1] == "img" && !PREF.dlPhoto && !rec.loaded){
    var ph = document.createElement("button");
    ph.className = "alt"; ph.textContent = t("sphoto") + " ⬇";
    ph.onclick = function(){ rec.loaded = true; buildBody(rec); };
    body.appendChild(ph);
    flags(rec); tickOne(rec);
    return;
  }
  if(mm){
    var el = document.createElement(mm[1] == "img" ? "img" : mm[1] == "vid" ? "video" : "audio");
    el.className = "media"; el.src = mm[2];
    var down = function(){ if(rec.stick) scrollDown(); };
    if(mm[1] == "vid"){ el.controls = true; el.preload = PREF.dlVideo ? "metadata" : "none"; el.onloadedmetadata = down; }
    else if(mm[1] == "aud"){ el.controls = true; el.preload = "metadata"; }
    else { el.onclick = function(){ window.open(mm[2]); }; el.onload = down; }
    body.appendChild(el);
    flags(rec); tickOne(rec);
    return;
  }
  var dd = DOC.exec(m.text);
  if(dd){
    var a = document.createElement("a");
    a.className = "doc"; a.href = dd[1]; a.download = dd[2]; a.target = "_blank";
    a.onclick = function(ev){ ev.stopPropagation(); };
    a.appendChild(mk("div", "di", "📄"));
    var ax = document.createElement("div");
    ax.appendChild(mk("div", "dn", dd[2]));
    ax.appendChild(mk("div", "ds", fmtSize(parseInt(dd[3], 10))));
    a.appendChild(ax);
    body.appendChild(a);
    flags(rec); tickOne(rec);
    return;
  }
  var tx = document.createElement("div");
  tx.className = "tx";
  body.appendChild(tx);
  rec.tx = tx;
  fillText(rec);
  tickOne(rec);
}

function addMsg(m, raw){
  var log = $("log");
  var stick = log.scrollHeight - log.scrollTop - log.clientHeight < 160;
  if(m.type == "system"){
    var s = document.createElement("div");
    s.className = "sys"; s.textContent = raw ? m.text : srv(m.text);
    log.appendChild(s);
    if(stick) scrollDown();
    return;
  }
  if(m.time){
    var dk = dayKey(m.time);
    if(dk !== LASTDAY){
      LASTDAY = dk;
      var ds = document.createElement("div");
      ds.className = "dsep"; ds.textContent = dayLabel(m.time);
      log.appendChild(ds);
    }
  }
  var mine = (m.name == me), dm = isDm();
  var row = document.createElement("div");
  row.className = "row" + (mine ? " mine" : "");
  var b = document.createElement("div");
  b.className = "b" + (mine ? " me" : "");
  var rec = {m: m, row: row, b: b, mine: mine, translated: false, trText: null, stick: stick || mine};
  if(m.id) MSGS[m.id] = rec;
  if(!mine && !dm){
    var av = document.createElement("div");
    av.className = "av"; setAv(av, m.avatar, 34);
    av.onclick = function(){ openProfile(m.name); };
    row.appendChild(av);
    var n = document.createElement("div");
    n.className = "n"; n.textContent = dn(m);
    if(m.color) n.style.color = m.color;
    n.onclick = function(){ openProfile(m.name); };
    b.appendChild(n);
  }
  if(m.fwd){
    b.appendChild(mk("div", "fwd", "↪ " + L("fwdfrom") + " " + (m.fwd.display || m.fwd.name)));
  }
  if(m.reply){
    var q = document.createElement("div");
    q.className = "quote";
    var qn = document.createElement("b"); qn.textContent = m.reply.display || m.reply.name;
    var qt = document.createElement("span");
    qt.textContent = m.reply.text ? snip(m.reply.text) : "🚫 " + t("deleted");
    q.appendChild(qn); q.appendChild(qt);
    q.onclick = function(){
      var r = MSGS[m.reply.id];
      if(!r) return;
      r.row.scrollIntoView({block: "center", behavior: "smooth"});
      r.b.classList.add("flash");
      setTimeout(function(){ r.b.classList.remove("flash"); }, 1200);
    };
    b.appendChild(q);
  }
  rec.body = document.createElement("div");
  rec.body.className = "bd";
  b.appendChild(rec.body);
  var tm = document.createElement("div");
  tm.className = "tm";
  rec.fl = document.createElement("span");
  var mn = document.createElement("span");
  mn.className = "mn"; mn.textContent = "⋯";
  mn.onclick = function(ev){ openMenu(rec, ev); };
  var hm = document.createElement("span"); hm.textContent = hhmm(m.time);
  rec.tk = document.createElement("span"); rec.tk.className = "tk";
  tm.appendChild(rec.fl); tm.appendChild(mn); tm.appendChild(hm); tm.appendChild(rec.tk);
  b.appendChild(tm);
  rec.rx = mk("div", "rxs");
  b.appendChild(rec.rx);
  b.oncontextmenu = function(ev){ ev.preventDefault(); openMenu(rec, ev); };
  row.appendChild(b);
  log.appendChild(row);
  buildBody(rec);
  renderReactions(rec);
  if(stick || mine) scrollDown();
}

/* ---------- message menu, reply, edit ---------- */
function closeMenu(){ $("menu").style.display = "none"; }

function copyText(s){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(s).catch(function(){}); return; }
  var a = document.createElement("textarea");
  a.value = s; document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){}
  a.remove();
}

function openMenu(rec, ev){
  ev.stopPropagation();
  if(rec.m.deleted || !rec.m.id) return;
  var mn = $("menu"); mn.innerHTML = "";
  var rr = document.createElement("div"); rr.className = "mrow";
  REACTS.forEach(function(e){
    var eb = document.createElement("button");
    eb.textContent = e;
    eb.onclick = function(evt){ evt.stopPropagation(); closeMenu(); reactTo(rec, e); };
    rr.appendChild(eb);
  });
  mn.appendChild(rr);
  function item(label, fn){
    var bt = document.createElement("button");
    bt.textContent = label;
    bt.onclick = function(e){ e.stopPropagation(); closeMenu(); fn(); };
    mn.appendChild(bt);
  }
  var isMedia = MEDIA.test(rec.m.text) || DOC.test(rec.m.text);
  item("↩ " + t("reply"), function(){ startReply(rec); });
  item("↪ " + L("fwd"), function(){ spOpen(pgForward(rec.m.id)); });
  if(canPinHere()){
    var pinned = PINMSG && PINMSG.id == rec.m.id;
    item("📌 " + (pinned ? L("unpinmsg") : L("pinmsg")), function(){
      if(ws) ws.send(JSON.stringify({type: "pin", id: rec.m.id, on: !pinned}));
    });
  }
  if(!isMedia) item("📋 " + t("copy"), function(){ copyText(rec.m.text); });
  if(!isMedia && !rec.mine && !rec.translated) item("🌐 " + L("trthis"), function(){ rec.forceTr = true; fillText(rec); });
  if(rec.mine && !isMedia) item("✏️ " + t("edit"), function(){ startEdit(rec); });
  if(rec.mine || isAdminHere()) item("🗑 " + t("del"), function(){ if(ws) ws.send(JSON.stringify({type: "del", id: rec.m.id})); });
  if(!rec.mine) item("🚩 " + t("report"), function(){ reportMsg(rec.m.id); });
  mn.style.display = "flex";
  var x = ev.clientX || 20, y = ev.clientY || 20;
  mn.style.left = Math.max(8, Math.min(x, window.innerWidth - 180)) + "px";
  mn.style.top = Math.max(8, Math.min(y, window.innerHeight - 70 - (mn.children.length - 1) * 44)) + "px";
}

function startReply(rec){
  editing = null;
  replyTo = {id: rec.m.id};
  $("rtxt").textContent = "↩ " + dn(rec.m) + ": " + snip(rec.m.text);
  $("rbar").style.display = "flex";
  $("msg").focus();
  updateMainBtn();
}

function startEdit(rec){
  replyTo = null;
  editing = rec;
  $("rtxt").textContent = "✏️ " + t("editing") + ": " + snip(rec.m.text);
  $("rbar").style.display = "flex";
  $("msg").value = rec.m.text;
  $("msg").focus();
  updateMainBtn();
}

function cancelReply(){
  if(editing) $("msg").value = "";
  replyTo = null; editing = null;
  $("rbar").style.display = "none";
  updateMainBtn();
}

function send(){
  var i = $("msg"), v = i.value.trim();
  if(!ws || !v) return;
  if(editing){
    if(v !== editing.m.text) ws.send(JSON.stringify({type: "edit", id: editing.m.id, text: v}));
    editing = null; i.value = "";
    $("rbar").style.display = "none";
    updateMainBtn();
    return;
  }
  var p = {type: "msg", text: v};
  if(replyTo) p.reply_to = replyTo.id;
  ws.send(JSON.stringify(p));
  i.value = "";
  trPrevHide();
  cancelReply();
}

function onType(){
  updateMainBtn();
  trPreview();
  var v = $("msg").value;
  if(ws && v && !editing && Date.now() - lastTypeSent > 2500){
    lastTypeSent = Date.now();
    ws.send(JSON.stringify({type: "typing"}));
  }
}

function updateMainBtn(){
  var b = $("bmain");
  if(!b) return;
  var has = $("msg").value.trim().length > 0 || !!editing;
  b.textContent = recording ? "⏹" : (has ? "➤" : "🎤");
  b.className = recording ? "rec" : "";
}

function mainAction(){
  if(recording) stopRec(true);
  else if($("msg").value.trim()) send();
  else startRec();
}

/* ---------- voice and files ---------- */
function startRec(){
  if(!ws) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    addMsg({type: "system", text: t("nomic")}, true); return;
  }
  navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream){
    var mt = "";
    ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].some(function(x){
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)){ mt = x; return true; }
      return false;
    });
    var rr;
    try{ rr = mt ? new MediaRecorder(stream, {mimeType: mt}) : new MediaRecorder(stream); }
    catch(e){
      stream.getTracks().forEach(function(x){ x.stop(); });
      addMsg({type: "system", text: t("nomic")}, true); return;
    }
    mr = rr; mchunks = []; mSend = false;
    rr.ondataavailable = function(e){ if(e.data && e.data.size) mchunks.push(e.data); };
    rr.onstop = function(){
      stream.getTracks().forEach(function(x){ x.stop(); });
      if(mSend && Date.now() - mStart > 800 && mchunks.length){
        sendFile(new Blob(mchunks, {type: rr.mimeType || mt || "audio/webm"}));
      }
    };
    rr.start();
    mStart = Date.now(); recording = true;
    $("msg").disabled = true; $("rcancel").style.display = "block";
    updateMainBtn();
    clearInterval(mTimer);
    mTimer = setInterval(function(){
      var s = Math.floor((Date.now() - mStart) / 1000);
      $("msg").placeholder = "🔴 " + Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2);
    }, 300);
  }).catch(function(){ addMsg({type: "system", text: t("nomic")}, true); });
}

function stopRec(sendIt){
  if(!recording) return;
  mSend = sendIt; recording = false;
  clearInterval(mTimer);
  $("msg").disabled = false; $("msg").placeholder = t("msg");
  $("rcancel").style.display = "none";
  try{ mr.stop(); }catch(e){}
  updateMainBtn();
}

function upload(inp){
  var f = inp.files[0]; inp.value = "";
  sendFile(f);
}

function sendFile(f){
  var w = ws;
  if(!f || !w) return;
  if(f.size > 25 * 1024 * 1024){ addMsg({type: "system", text: t("big")}, true); return; }
  var nt = note(t("sending"));
  fetch("/upload?token=" + enc(tok) + "&fname=" + enc(f.name || ""), {
    method: "POST", headers: {"Content-Type": fileType(f)}, body: f
  }).then(function(r){ return r.json(); }).then(function(d){
    nt.remove();
    if(d.error){ addMsg({type: "system", text: t("upfail")}, true); return; }
    var txt;
    if(d.kind == "doc") txt = "[doc]" + d.url + "|" + d.name + "|" + (d.size || f.size || 0);
    else txt = (d.kind == "img" ? "[img]" : d.kind == "vid" ? "[vid]" : "[aud]") + d.url;
    if(ws === w) w.send(JSON.stringify({type: "msg", text: txt}));
  }).catch(function(){ nt.remove(); addMsg({type: "system", text: t("upfail")}, true); });
}

/* ---------- profile ---------- */
function fmtSeen(ts){
  if(dayKey(ts) == dayKey(Date.now())) return hhmm(ts);
  var d = new Date(ts);
  return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + " " + hhmm(ts);
}

function statusText(p){
  if(p.online) return t("online");
  if(p.hidden) return "⚪ " + t("recent");
  if(p.last_seen) return "⚪ " + t("lastseen") + fmtSeen(p.last_seen);
  return t("offline");
}

function openProfile(name){

    if(p.error) return;

    $("pname").textContent = p.display || p.name;
    $("punm").textContent = "@" + p.name;
    $("pstat").textContent = statusText(p);
    $("pbio").textContent = p.bio || t("nobio");
    var mine = (p.name == me);
    $("pedit").style.display = mine ? "block" : "none";
    $("pbio").style.display = mine ? "none" : "block";
    var pa = $("pact"); pa.innerHTML = "";
    $("blist").innerHTML = "";
    if(mine){
      chosen = p.avatar;
      $("bioin").value = p.bio;
      $("dnin").value = p.display || p.name;
      $("seenin").value = p.hide_seen ? "1" : "0";

      pk.innerHTML = "";

        var sp = document.createElement("span");
        sp.className = "opt"; sp.textContent = a;
        sp.onclick = function(){ chosen = a; setAv($("pav"), a, 96); };
        pk.appendChild(sp);
      });
    } else {
      if(!isDm() || dmOther(curRoom) != p.name){
        var wb = document.createElement("button");
        wb.textContent = "💬 " + t("dmbtn");
        wb.onclick = function(){ closeP(); openDm({name: p.name, avatar: p.avatar, display: p.display}); };

      bb.onclick = function(){ setBlock(p.name, !p.blocked); };

function isImg(a){ return /^\/uploads\/[\w\-]+\.(jpg|png|gif|webp)$/.test(a || ""); }

function setAv(el, a, px){
  el.textContent = "";
  if(isImg(a)){
    var im = document.createElement("img");
    im.src = a;
    im.style.cssText = "width:" + px + "px;height:" + px + "px;object-fit:cover;border-radius:50%;display:block";
    el.appendChild(im);
  } else el.textContent = a || "🙂";
}

function uploadAvatar(inp){
  var f = inp.files[0]; inp.value = "";
  if(!f) return;
  var img = new Image();
  img.onload = function(){
    var s = Math.min(img.width, img.height), c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
    URL.revokeObjectURL(img.src);
    c.toBlob(function(blob){
      fetch("/upload?token=" + enc(tok), {
        method: "POST", headers: {"Content-Type": "image/jpeg"}, body: blob
      }).then(function(r){ return r.json(); }).then(function(d){
        if(d.url){ chosen = d.url; if(window.avCb){ window.avCb(d.url); } else setAv($("pav"), d.url, 96); }
      }).catch(function(){});
    }, "image/jpeg", 0.85);
  };
  img.src = URL.createObjectURL(f);
}

function cardEl(c, click){
  var R = (LANG == "ru") ? RANKS_RU : RANKS;
  var d = document.createElement("div");
  d.className = "card" + (c[1] == 1 || c[1] == 2 ? " red" : "");
  d.textContent = R[c[0]] + SUITS[c[1]];
  if(click) d.onclick = click;
  return d;
}

function showGame(g){
  var p = $("game");
  if(g.gone){ lastGame = null; p.style.display = "none"; return; }
  lastGame = g;
  p.style.display = "block";
  var kind = g.kind || "durak", dur = (kind == "durak");
  ["gtop", "gtable", "gstatus", "gerr", "ghand", "gbtn"].forEach(function(id){ $(id).style.display = dur ? "" : "none"; });
  $("gx").style.display = dur ? "none" : "block";
  if(!dur){ (kind == "xo" ? renderXO : renderRPS)(g); return; }
  $("gerr").textContent = "";
  var parts = g.others.map(function(o){
    return (o.name == g.attacker ? "🗡" : "") + (o.name == g.defender ? "🛡" : "") +
           o.name + ": " + (o.out ? "✅" : o.n + t("cards"));
  });
  $("gtop").textContent =
    parts.join(" | ") + " | " + t("deck") + g.deck_n + " | " + t("trump") + SUITS[g.trump];
  var tb = $("gtable"); tb.innerHTML = "";
  g.table.forEach(function(pr){
    var w = document.createElement("div"); w.className = "pair";
    w.appendChild(cardEl(pr[0]));
    if(pr[1]){ var c = cardEl(pr[1]); c.className += " over"; w.appendChild(c); }
    tb.appendChild(w);
  });
  var h = $("ghand"); h.innerHTML = "";
  g.hand.forEach(function(c){
    h.appendChild(cardEl(c, function(){ act(g.defender == me ? "defend" : "attack", c); }));
  });
  var st;
  if(g.over) st = srv(g.msg);
  else if(g.out) st = t("outs");
  else if(g.defender == me) st = t("def");
  else if(g.attacker == me) st = t("att");
  else st = t("help");
  if(!g.over && g.msg) st += " (" + srv(g.msg) + ")";
  $("gstatus").textContent = st;
  var active = !g.over && !g.out;
  $("btake").style.display = (active && g.defender == me) ? "block" : "none";
  $("bdone").style.display = (active && g.defender != me) ? "block" : "none";
}

function act(action, card, game){
  var p = {type: "game", action: action, card: (card === undefined ? null : card)};
  if(game) p.game = game;
  if(ws) ws.send(JSON.stringify(p));
}

/* ---- tiny UI builders ---- */
function mk(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function secEl(box, title){
  var sc = mk("div", "sec");
  if(title) sc.appendChild(mk("div", "sh", title));
  box.appendChild(sc);

}
function rowEl(sec, icon, label, sub, right, fn, cls){
  var r = mk("div", "sr" + (cls ? " " + cls : ""));
  if(icon) r.appendChild(mk("div", "si", icon));
  var x = mk("div", "sx");
  x.appendChild(mk("div", "sl", label));
  if(sub) x.appendChild(mk("div", "ss", sub));
  r.appendChild(x);
  if(right) r.appendChild(mk("div", "sv", right));

function parseUA(ua){
  ua = ua || "";
  var b = /Edg\//.test(ua) ? "Edge" : /OPR\/|Opera/.test(ua) ? "Opera" : /Firefox\//.test(ua) ? "Firefox" :
          /Chrome\/|CriOS/.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Browser";
  var o = "", ic = "🌐";
  if(/Android/.test(ua)){ o = "Android"; ic = "📱"; }
  else if(/iPhone|iPad|iPod/.test(ua)){ o = "iOS"; ic = "📱"; }
  else if(/Windows/.test(ua)){ o = "Windows"; ic = "🖥"; }
  else if(/Mac OS X|Macintosh/.test(ua)){ o = "macOS"; ic = "💻"; }
  else if(/Linux|X11/.test(ua)){ o = "Linux"; ic = "🐧"; }
  return {name: b + (o ? " · " + o : ""), icon: ic};
}

/* ---- notifications ---- */
function beep(f){
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    var c = new C(), o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = f || 880; g.gain.value = .06;
    o.connect(g); g.connect(c.destination); o.start();
    setTimeout(function(){ try{ o.stop(); c.close(); }catch(e){} }, 130);
  }catch(e){}
}
function showNote(title, body, room){
  if(!PREF.nBrowser || !window.Notification || Notification.permission != "granted") return;
  try{
    var n = new Notification(title, {body: body, tag: room});
    n.onclick = function(){ window.focus(); openRoom(room); n.close(); };
  }catch(e){}
}
function checkNotify(quiet){
  var items = chatItems(), total = 0, cur = {}, fire = null;
  items.forEach(function(x){
    var muted = MUTES.indexOf(x.room) >= 0;
    cur[x.room] = x.unread;
    if(x.unread > 0 && (!muted || PREF.badgeMuted)) total += x.unread;
    if(!quiet && LAST_UN && !x.dm && x.room.indexOf("g:") != 0 && x.unread > (LAST_UN[x.room] || 0) && !muted && PREF.nGroup) fire = x;
  });
  LAST_UN = cur;
  document.title = (PREF.badge && total > 0 ? "(" + total + ") " : "") + t("title");
  if(fire){
    if(PREF.nSound) beep(880);
    if(PREF.nVib && navigator.vibrate) navigator.vibrate(120);
    if(document.hidden) showNote(fire.title, PREF.nPrev ? lastText(fire) : "", fire.room);
  }
}
function onNotify(m){
  loadChats();
  if(m.room == curRoom && document.visibilityState == "visible") return;
  var grp = m.room.indexOf("g:") == 0;
  if(MUTES.indexOf(m.room) >= 0 || !(grp ? PREF.nGroup : PREF.nPriv)) return;
  if(PREF.nSound) beep(880);
  if(PREF.nVib && navigator.vibrate) navigator.vibrate(120);
  var who = m.display || m.name;
  showNote(grp ? (m.title || who) : who, (grp ? who + ": " : "") + (PREF.nPrev ? snip(m.text) : ""), m.room);
}
function connectUsock(){
  if(!tok || usock) return;
  var proto = location.protocol == "https:" ? "wss://" : "ws://";
  var u = new WebSocket(proto + location.host + "/wsu/" + enc(tok));
  var t0 = Date.now();
  usock = u;
  u.onopen = function(){ u.ok = true; t0 = Date.now(); };
  u.onmessage = function(e){
    var m; try{ m = JSON.parse(e.data); }catch(x){ return; }
    if(m.type == "notify") onNotify(m);
    else if(m.type == "chats") loadChats();
  };
  u.onclose = function(){
    if(usock !== u) return;
    usock = null;
    if(u.ok && Date.now() - t0 < 2000) return;
    clearTimeout(usockT);
    if(tok) usockT = setTimeout(connectUsock, 4000);
  };
}

      spRender();
      // natija sahifa yangilanganda yo'qolmasligi uchun qayta ko'rsatamiz
      setTimeout(function(){ var o = document.querySelector("#spc .sn.aiout"); if(o) o.textContent = out.textContent; }, 0);
    }).catch(function(){ out.textContent = "❌"; });
  });
  rowEl(b, "💬", L("aiopen"), null, "", function(){ spClose(); openRoom(dmRoom(AI_USER)); });
  out.className = "sn aiout";
  box.appendChild(out);
  noteEl(box, L("ainote"));
}

  pickone:["Tanlang","Выбирайте","Pick one"], rematch:["Qayta o'ynash","Сыграть ещё","Play again"],
  gdraw:["Durang","Ничья","Draw"], round:["Raund","Раунд","Round"], toreach:["gacha","до","to"],

var lastLobby = null;
var GAMEINFO = {
  durak: {icon: "🃏", title: function(){ return "Durak"; }, desc: "gdurak"},
  xo: {icon: "⭕", title: function(){ return "XO"; }, desc: "gxo"},
  rps: {icon: "✊", title: function(){ return L("rpsname"); }, desc: "grps"}
};
function pgGames(box){
  spTitle(L("gamesh"));
  var sc = secEl(box, null);
  ["durak", "xo", "rps"].forEach(function(k){
    var gi = GAMEINFO[k];
    rowEl(sc, gi.icon, gi.title(), L(gi.desc), "", function(){ spClose(); act("join", null, k); });
  });
  noteEl(box, L("gstart"));
}
function renderXO(g){
  var box = $("gx"); box.innerHTML = "";
  var mine = g.players.indexOf(me) >= 0;
  var head = mk("div", "gxh", "❌ " + g.players[0] + "   vs   ⭕ " + g.players[1]);
  box.appendChild(head);
  var turnMe = (g.turn == me);
  var st = g.over ? srv(g.msg) : (turnMe ? L("yourturn") : g.turn + " " + L("turnof"));
  box.appendChild(mk("div", "gxs", st));
  var grid = mk("div", "xo");
  for(var i = 0; i < 9; i++){
    (function(i){
      var v = g.board[i];
      var b = mk("button", (g.line && g.line.indexOf(i) >= 0) ? "win" : "", v == "X" ? "❌" : v == "O" ? "⭕" : "");
      b.onclick = function(){ if(!g.over && turnMe && !v && mine) act("move", i); };
      grid.appendChild(b);
    })(i);
  }
  box.appendChild(grid);
  box.appendChild(mk("div", null, "")).id = "gxerr";
  if(g.over && mine){
    var rb = mk("button", null, L("rematch"));
    rb.onclick = function(){ act("join", null, "xo"); };
    box.appendChild(rb);
  }
}
var RPSI = {rock: "✊", paper: "✋", scissors: "✌️"};
function renderRPS(g){
  var box = $("gx"); box.innerHTML = "";
  var a = g.players[0], b = g.players[1];
  var mineP = g.players.indexOf(me) >= 0;
  box.appendChild(mk("div", "gxh", L("round") + " " + g.round + "  ·  " + a + " " + g.score[a] + " : " + g.score[b] + " " + b + "  (" + L("toreach") + " " + g.target + ")"));
  if(g.last){
    var lc = g.last.choices;
    var res = g.last.winner ? g.last.winner + " ✓" : L("gdraw");
    box.appendChild(mk("div", "gxh", a + " " + RPSI[lc[a]] + "  vs  " + RPSI[lc[b]] + " " + b + "  →  " + res));
  }
  if(g.over){
    box.appendChild(mk("div", "gxs", srv(g.msg)));
  } else {
    box.appendChild(mk("div", "gxs", g.mine ? L("waitopp") : L("pickone")));
    var row = mk("div", "rpsb");
    ["rock", "paper", "scissors"].forEach(function(k){
      var bt = mk("button", g.mine == k ? "sel" : "", RPSI[k]);
      bt.onclick = function(){ if(!g.mine && mineP) act("pick", k); };
      row.appendChild(bt);
    });
    box.appendChild(row);
  }
  box.appendChild(mk("div", null, "")).id = "gxerr";
  if(g.over && mineP){
    var rb = mk("button", null, L("rematch"));
    rb.onclick = function(){ act("join", null, "rps"); };
    box.appendChild(rb);
  }
}
